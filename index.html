.mapwrap{position:relative;max-width:1080px;margin:16px auto}

footer{text-align:center;color:var(--mut);font-size:13px;padding:0 0 40px}
.src{font-size:12px;color:var(--mut)}
</style>
</head>

];
const map=L.map('map').setView([25.03,121.45],10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const markers={};
const CITYC={"台北":"#2D7DD2","新北":"#1F8A5B","基隆":"#184E77","桃園":"#C08A2D"};
const BADGES=["badges/00-tianmu-trampoline.png","badges/01-huabo-butterfly.png","badges/02-dajia-octopus.png","badges/03-metro-bear.png","badges/04-yingge-bell.png","badges/05-lohas-train.png","badges/06-nuannuan-sun.png","badges/07-hope-hillstar.png","badges/08-chaojing-spiral.png","badges/09-zhengguang-fruit.png","badges/10-nankan-river.png","badges/11-fenghe-rice.png","badges/12-dayou-terrace.png","badges/13-guangming-treehouse.png","badges/14-yangming-grasslide.png","badges/15-xinxin-zipline.png","badges/16-jinhe-roller.png","badges/17-dawulun-mountain.png","badges/18-fengshujiao-giraffe.png"];
PARKS.forEach((p,i)=>{
const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:'<span class="pin" style="--pc:'+(CITYC[p.city]||"#E85A24")+'"></span>',iconSize:[26,26],iconAnchor:[13,23]})}).addTo(map);
m.bindPopup(`<b>${p.name}</b><br>${p.city}${p.dist}・${p.age}<br><a href="${p.nav}" target="_blank">導航</a>｜<a href="${p.info}" target="_blank">介紹</a>${p.approx?'<br><small>座標為鄰近定位</small>':''}`);
markers[i]=m;});
const grid=document.getElementById('grid'),count=document.getElementById('count');
function card(p,i){
const SLIDE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h9a3 3 0 0 1 3 3v1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13 8c3 1 5 3 6 6l2 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4v3M7 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="18.5" cy="5" r="2" fill="currentColor"/></svg>';
const isBadge=p.img&&p.img.indexOf("badges/")===0;const ph=p.img?`<img class="ph${isBadge?" badge-ph":""}" loading="lazy" src="${p.img}" alt="${p.name}" onerror="this.outerHTML='<div class=&quot;ph-fallback&quot;>'+SLIDE+'</div>'">`:`<div class="ph-fallback">${SLIDE}</div>`;
return `<div class="card" data-i="${i}"><div>${ph}</div><div class="body">
<div class="title-row"><span class="badge"><img loading="lazy" src="${BADGES[i]}" alt="${p.name}徽章"></span><h2>${p.name}</h2><span class="tag city-${p.city}">${p.city}</span></div>
<div class="tagrow"><span class="tag">${p.dist}</span><span class="tag age">${p.age}</span></div>
<div class="kid">${p.kid}</div>
<div class="spec"><b>遊具</b><span>${p.toys}</span></div>
<div class="spec"><b>地址</b><span>${p.addr}</span></div>
<div class="spec"><b>提醒</b><span>${p.tip}</span></div>
<div class="btns"><a class="a1" href="${p.nav}" target="_blank">導航</a><a class="a2" href="${p.info}" target="_blank">介紹</a></div>
</div></div>`;}
function render(f){
const idx=PARKS.map((p,i)=>i).filter(i=>f==="全部"||PARKS[i].city===f);
grid.innerHTML=idx.map(i=>card(PARKS[i],i)).join('');
count.textContent=`共 ${idx.length} 座・點卡片「導航」直接出發`;
Object.values(markers).forEach(m=>m.remove());
idx.forEach(i=>markers[i].addTo(map));
if(idx.length){const g=L.featureGroup(idx.map(i=>markers[i]));map.fitBounds(g.getBounds().pad(0.15));}}
document.getElementById('toolbar').addEventListener('click',e=>{
if(e.target.tagName!=='BUTTON')return;
document.querySelectorAll('#toolbar button').forEach(b=>b.classList.remove('on'));
e.target.classList.add('on');render(e.target.dataset.c);});
render("全部");
</script>
</body>
