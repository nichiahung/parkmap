const $ = (s) => document.querySelector(s);
const loadmsg = (t) => { $('#loadmsg').textContent = t; };
function fail(title, msg) {
  $('#loading').style.display = 'none';
  $('#errtitle').textContent = title;
  $('#errmsg').textContent = msg;
  $('#errbox').classList.add('show');
}
$('#reloadbtn').addEventListener('click', () => location.reload());
window.addEventListener('error', (e) => {
  if ($('#errbox').classList.contains('show')) return;
  fail(window.__booted ? '執行期錯誤' : '載入發生問題', String((e && e.message) || e) + '\n可按下方按鈕重新載入。');
});
window.addEventListener('unhandledrejection', (e) => {
  if ($('#errbox').classList.contains('show')) return;
  const r = e && e.reason;
  fail('載入發生問題', String((r && r.message) || r || '未處理的非同步錯誤') + '\n可按下方按鈕重新載入。');
});

/* ---------- 固定種子亂數 ---------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const MODEL_NAMES = new Set(DATA.meta.modelPrototypes);

/* ---------- DATA 驗證 ---------- */
function validateDATA(d) {
  if (!d || !d.meta || !d.labels || !d.config || !d.environment) throw new Error('DATA 缺少 meta／labels／config／environment');
  if (!Array.isArray(d.islands) || !Array.isArray(d.items) || !Array.isArray(d.flows) || !Array.isArray(d.sources)) {
    throw new Error('DATA 的 islands／items／flows／sources 必須是陣列');
  }
  if (d.meta.mode === 'provided' && !d.sources.length) throw new Error('provided 模式必須提供來源');

  const ids = new Set(), names = new Set(), cells = new Set();
  const colors = /^#[0-9a-f]{6}$/i;
  const groundKinds = new Set(['brick', 'spots', 'stripes']);
  for (const isl of d.islands) {
    for (const f of ['id', 'name', 'en', 'summary', 'summaryEn', 'icon', 'treeType', 'itemIds', 'color', 'groundPattern']) {
      if (!isl[f]) throw new Error('島嶼缺少欄位 ' + f + '：' + (isl.name || isl.id || '未知'));
    }
    if (!Array.isArray(isl.itemIds)) throw new Error('島嶼 itemIds 必須是陣列：' + isl.name);
    if (!isl.summary || !isl.summaryEn) throw new Error('島嶼缺少中英文摘要：' + isl.name);
    for (const id of isl.itemIds) {
      if (!d.items.some((it) => it.id === id)) throw new Error('島嶼 itemIds 無對應項目：' + isl.name + '／' + id);
    }
    if (!Number.isInteger(isl.q) || !Number.isInteger(isl.r)) throw new Error('島嶼座標必須是整數：' + isl.name);
    if (!colors.test(isl.color)) throw new Error('島嶼顏色格式錯誤：' + isl.name);
    if (!groundKinds.has(isl.groundPattern)) throw new Error('島嶼地面圖樣無效：' + isl.name);
    if (ids.has(isl.id)) throw new Error('島嶼 id 重複：' + isl.id);
    if (names.has(isl.name)) throw new Error('島嶼名稱重複：' + isl.name);
    const k = isl.q + ',' + isl.r;
    if (cells.has(k)) throw new Error('島嶼座標重複：' + isl.name);
    ids.add(isl.id); names.add(isl.name); cells.add(k);
  }

  const itemIds = new Set(), itemNames = new Set();
  const sourceIds = new Set(d.sources.map((src) => src.id));
  for (const it of d.items) {
    for (const f of ['id', 'islandId', 'name', 'summary', 'model', 'contentMode']) {
      if (!it[f]) throw new Error('項目缺少欄位 ' + f + '：' + (it.id || it.name || '未知'));
    }
    if (itemIds.has(it.id)) throw new Error('項目 id 重複：' + it.id);
    if (itemNames.has(it.name)) throw new Error('項目名稱重複：' + it.name);
    if (!MODEL_NAMES.has(it.model)) throw new Error('項目模型未註冊：' + it.id + '／' + it.model);
    if (!Array.isArray(it.facts)) throw new Error('項目 facts 必須是陣列：' + it.id);
    if (!Array.isArray(it.sourceIds) || !it.sourceIds.length) throw new Error('項目缺少來源：' + it.id);
    for (const sid of it.sourceIds) if (!sourceIds.has(sid)) throw new Error('項目來源不存在：' + it.id + '／' + sid);
    const isl = d.islands.find((i) => i.id === it.islandId);
    if (!isl) throw new Error('項目所屬島嶼不存在：' + it.id);
    if (!isl.itemIds.includes(it.id)) throw new Error('島嶼 itemIds 未列出項目：' + isl.id + '／' + it.id);
    itemIds.add(it.id); itemNames.add(it.name);
  }
  for (const isl of d.islands) {
    if (isl.heroItemId && !isl.itemIds.includes(isl.heroItemId)) throw new Error('主要模型不屬於島嶼：' + isl.id);
    const actual = d.items.filter((it) => it.islandId === isl.id).map((it) => it.id);
    if (actual.length !== isl.itemIds.length || actual.some((id) => !isl.itemIds.includes(id))) {
      throw new Error('島嶼 itemIds 與項目 islandId 不一致：' + isl.id);
    }
  }
  if (!d.items.length) throw new Error('至少需要一個項目模型');

  const parkNames = new Set();
  for (const [c, p] of Object.entries(d.parks)) {
    if (!d.islands.some((i) => i.name === c)) throw new Error('景點縣市無對應島嶼：' + c);
    if (!Number.isInteger(p.count) || p.count < 1) throw new Error(c + ' 景點筆數無效');
    if (p.count !== p.names.length) throw new Error(c + ' 筆數與名單不一致');
    for (const n of p.names) {
      if (!n || parkNames.has(n)) throw new Error('景點名稱空白或重複：' + c + '／' + n);
      parkNames.add(n);
    }
  }
  const total = Object.values(d.parks).reduce((n, p) => n + p.count, 0);
  if (!(total > 0)) throw new Error('景點總數無效');
  if (d.islands.length < 1) throw new Error('島嶼數量無效');
  const todo = d.islands.filter((i) => !d.parks[i.name]).length;
  if (todo !== d.islands.length - Object.keys(d.parks).length) throw new Error('待補島嶼計算不一致，實際待補 ' + todo);
  // 路網連通性：橋樑相鄰＋船線，全部島嶼須連通
  {
    const idOf = new Map(d.islands.map((i) => [i.id, i]));
    const cell = new Map(d.islands.map((i) => [i.q + ',' + i.r, i.id]));
    const adj = new Map(d.islands.map((i) => [i.id, new Set()]));
    const D6 = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
    for (const isl of d.islands) for (const [dq, dr] of D6) {
      const nb = cell.get((isl.q + dq) + ',' + (isl.r + dr));
      if (nb) { adj.get(isl.id).add(nb); adj.get(nb).add(isl.id); }
    }
    for (const f of d.ferries || []) {
      if (!idOf.has(f.from) || !idOf.has(f.to)) throw new Error('船線端點無對應島嶼：' + f.id);
      adj.get(f.from).add(f.to); adj.get(f.to).add(f.from);
    }
    const seen = new Set([d.islands[0].id]);
    const queue = [d.islands[0].id];
    while (queue.length) { const cur = queue.pop(); for (const nb of adj.get(cur)) if (!seen.has(nb)) { seen.add(nb); queue.push(nb); } }
    if (seen.size !== d.islands.length) throw new Error('群島未完全連通（橋＋船），僅連通 ' + seen.size + '／' + d.islands.length);
  }

  if (!Number.isFinite(d.environment.startMinutes) || !Number.isFinite(d.environment.minutesPerSecond)) {
    throw new Error('environment 缺少初始時間或時間速度');
  }
  const kf = d.environment.keyframes;
  if (!kf.length || kf[0].m !== 0 || kf[kf.length - 1].m !== 1440) throw new Error('日夜 keyframes 不完整');
  let prevM = -1;
  for (const k of kf) {
    if (!Number.isFinite(k.m) || k.m <= prevM) throw new Error('日夜 keyframes 分鐘需遞增');
    prevM = k.m;
    for (const f of ['top', 'hor', 'sun', 'hs', 'hg', 'water']) {
      if (!colors.test(k[f])) throw new Error('日夜 keyframe 顏色格式錯誤：' + k.m + '／' + f);
    }
    for (const f of ['sunI', 'hemiI', 'night']) {
      if (!Number.isFinite(k[f])) throw new Error('日夜 keyframe 數值錯誤：' + k.m + '／' + f);
    }
  }
  const cam = d.config.camera;
  for (const f of ['fov', 'near', 'far', 'minDistance', 'maxDistance']) {
    if (!Number.isFinite(cam[f])) throw new Error('相機設定缺少 ' + f);
  }
  if (!Array.isArray(cam.panoramaDir) || cam.panoramaDir.length !== 3) throw new Error('相機全景方向無效');
}

/* ================= 啟動 ================= */
boot().catch((err) => {
  console.error(err);
  fail('載入失敗', '原因：' + (err && err.message ? err.message : String(err)) + '\n請確認網路連線（需載入 Three.js CDN）與瀏覽器 WebGL 支援，或按下方按鈕重新載入。');
});

async function boot() {
  loadmsg('檢查資料…');
  validateDATA(DATA);

  loadmsg('載入 Three.js（CDN）…');
  let THREE, OrbitControls, CSS2DRenderer, CSS2DObject, RoundedBoxGeometry, BufferGeometryUtils, SimplexNoise;
  try {
    THREE = await import('three');
    ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
    ({ CSS2DRenderer, CSS2DObject } = await import('three/addons/renderers/CSS2DRenderer.js'));
    ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
    BufferGeometryUtils = await import('three/addons/utils/BufferGeometryUtils.js');
    ({ SimplexNoise } = await import('three/addons/math/SimplexNoise.js'));
  } catch (e) {
    throw new Error('Three.js CDN 載入失敗（需要網路連線）。' + (e && e.message ? ' ' + e.message : ''));
  }

  const state = {
    envMinutes: DATA.environment.startMinutes,
    selectedIsland: null,
    userInteracted: false, dead: false,
    net: null, islandMeshes: new Map(), labelObjs: new Map()
  };
  let dirty = true;
  // localStorage：讀寫都 try/catch，不可阻止展示
  try {
    const saved = JSON.parse(localStorage.getItem('island3d-stage2') || '{}');
    if (typeof saved.envMinutes === 'number') state.envMinutes = Math.min(1439, Math.max(0, saved.envMinutes));
  } catch (e) { /* 忽略 */ }
  const persist = () => {
    try { localStorage.setItem('island3d-stage2', JSON.stringify({ envMinutes: Math.round(state.envMinutes) })); }
    catch (e) { /* 忽略 */ }
  };

  const { R, SPACING, TOP, WATER_Y } = DATA.config;
  const SQRT3 = Math.sqrt(3);
  const axialToWorld = (q, r) => ({ x: SQRT3 * SPACING * (q + r / 2), z: 1.5 * SPACING * r });

  /* ---------- Renderer / Scene / Camera ---------- */
  loadmsg('建立渲染器…');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) {
    throw new Error('此裝置或瀏覽器不支援 WebGL，無法顯示 3D 場景。請改用支援 WebGL 的 Chrome / Edge / Safari 再試一次。');
  }
  if (!renderer.getContext()) throw new Error('無法建立 WebGL 繪圖環境（WebGL context 建立失敗）。');
  const isMobile = Math.min(innerWidth, innerHeight) < 800 || /Mobi|Android/i.test(navigator.userAgent);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.4 : 1.75));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  let shaderError = null;
  renderer.debug.checkShaderErrors = true;
  renderer.debug.onShaderError = (gl, program, glVertexShader, glFragmentShader) => {
    const vs = gl.getShaderInfoLog(glVertexShader) || '';
    const fs = gl.getShaderInfoLog(glFragmentShader) || '';
    const link = gl.getProgramInfoLog(program) || '';
    shaderError = (link + '\n' + vs + '\n' + fs).trim().slice(-700);
    console.error('Shader compile/link error', shaderError);
  };
  $('#scene').appendChild(renderer.domElement);

  const labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(innerWidth, innerHeight);
  $('#labels').appendChild(labelRenderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf4eee3, 42, 150);

  const camera = new THREE.PerspectiveCamera(DATA.config.camera.fov, innerWidth / innerHeight, DATA.config.camera.near, DATA.config.camera.far);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minPolarAngle = THREE.MathUtils.degToRad(25);
  controls.maxPolarAngle = THREE.MathUtils.degToRad(70);
  controls.minDistance = DATA.config.camera.minDistance;
  controls.maxDistance = DATA.config.camera.maxDistance;
  controls.addEventListener('start', () => { state.userInteracted = true; });

  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    state.dead = true;
    fail('顯示中斷', 'WebGL 繪圖環境遺失（顯示卡重置或資源不足）。\n請按下方按鈕重新載入。');
  });

  /* ---------- 燈光 ---------- */
  const hemi = new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 1.3);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1de, 2.8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
  sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 90;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.045; sun.shadow.radius = 3;
  scene.add(sun); scene.add(sun.target);
  const fill = new THREE.DirectionalLight(0xbfd6ff, 0.35);
  fill.position.set(-18, 12, -20);
  scene.add(fill);

  /* ---------- 天空 ---------- */
  const skyUni = {
    uTop: { value: new THREE.Color('#9fd0ec') },
    uHorizon: { value: new THREE.Color('#f4eee3') },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) },
    uSun: { value: new THREE.Color('#fff1de') },
    uNight: { value: 0 }
  };
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(170, 32, 20),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: skyUni,
      vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: [
        'varying vec3 vDir; uniform vec3 uTop,uHorizon,uSun; uniform vec3 uSunDir; uniform float uNight;',
        'float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453); }',
        'void main(){',
        '  vec3 dir = normalize(vDir);',
        '  vec3 col = mix(uHorizon, uTop, smoothstep(-0.02, 0.55, dir.y));',
        '  col += uSun * pow(max(dot(dir, uSunDir), 0.0), 18.0) * 0.35;',
        '  vec3 cell = floor(dir * 180.0);',
        '  float star = step(0.9965, hash(cell)) * uNight * smoothstep(-0.12, 0.25, dir.y);',
        '  col += vec3(star) * 0.85;',
        '  gl_FragColor = vec4(col, 1.0);',
        '  #include <tonemapping_fragment>',
        '  #include <colorspace_fragment>',
        '}'
      ].join('\n')
    })
  );
  scene.add(sky);

  /* ---------- 水面 ---------- */
  const waterUni = THREE.UniformsUtils.merge([
    THREE.UniformsLib.fog,
    { uShallow: { value: new THREE.Color('#a4d4da') }, uDeep: { value: new THREE.Color('#6fa9b8') }, uTint: { value: new THREE.Color('#a9d8db') }, uTime: { value: 0 }, uNight: { value: 0 } }
  ]);
  const water = new THREE.Mesh(
    new THREE.CircleGeometry(160, 64).rotateX(-Math.PI / 2),
    new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: true, uniforms: waterUni,
      vertexShader: [
        'varying vec3 vW; varying float vFogDepth;',
        'void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vW = wp.xyz;',
        '  vec4 mv = viewMatrix * wp; vFogDepth = -mv.z;',
        '  gl_Position = projectionMatrix * mv; }'
      ].join('\n'),
      fragmentShader: [
        'varying vec3 vW; uniform vec3 uShallow,uDeep,uTint; uniform float uTime, uNight;',
        'uniform vec3 fogColor; uniform float fogNear, fogFar; varying float vFogDepth;',
        'void main(){',
        '  float w1 = sin(vW.x * 0.16 + uTime * 0.6) * sin(vW.z * 0.13 - uTime * 0.4);',
        '  float w2 = sin((vW.x + vW.z) * 0.07 + uTime * 0.25);',
        '  vec3 col = mix(uShallow, uDeep, clamp(0.5 + 0.28 * w1 + 0.22 * w2, 0.0, 1.0));',
        '  col = mix(col, uTint, 0.78);',
        '  float dc = length(vW.xz) / 60.0;',
        '  col = mix(col, uTint * 0.72, clamp(dc, 0.0, 1.0) * 0.55);',
        '  float sp = pow(max(0.0, sin(vW.x * 1.7 + uTime * 1.1) * sin(vW.z * 1.53 - uTime * 0.9)), 30.0);',
        '  col += vec3(1.0, 0.98, 0.94) * sp * (0.14 * (1.0 - 0.8 * uNight));',
        '  float fogF = smoothstep(fogNear, fogFar, vFogDepth);',
        '  col = mix(col, fogColor, fogF);',
        '  gl_FragColor = vec4(col, 1.0);',
        '  #include <tonemapping_fragment>',
        '  #include <colorspace_fragment>',
        '}'
      ].join('\n')
    })
  );
  water.position.y = WATER_Y; water.renderOrder = 0;
  scene.add(water);

  /* ---------- 地面貼圖（canvas 程序產生：磚紋／斑點／條紋） ---------- */
  function groundTexture(kind) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#f2e7d5'; g.fillRect(0, 0, 256, 256);
    if (kind === 'brick') {
      g.strokeStyle = '#d9c6a8'; g.lineWidth = 3;
      for (let y = 0; y <= 256; y += 32) {
        g.beginPath(); g.moveTo(0, y); g.lineTo(256, y); g.stroke();
        const off = (y / 32) % 2 ? 32 : 0;
        for (let x = off; x <= 256; x += 64) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 32); g.stroke(); }
      }
    } else if (kind === 'spots') {
      const r2 = mulberry32(DATA.meta.seed);

  function edgePoint(center, toward) {
    let best = null, bd = -2;
    for (let k = 0; k < 6; k++) {
      const a = (k * Math.PI) / 3;
      const dx = Math.cos(a), dz = Math.sin(a);

  function buildRoadNet() {
    const nodes = [], adj = new Map(), keyOf = new Map();
    const addNode = (x, y, z2, island) => {
      const idx = nodes.length;
      nodes.push({ x, y, z: z2, island }); adj.set(idx, []);
      return idx;
    };
    const link = (i, j) => {
      const w = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].z - nodes[j].z);
      adj.get(i).push({ to: j, w }); adj.get(j).push({ to: i, w });
    };

      const { x: cx, z: cz } = axialToWorld(isl.q, isl.r);
      const ring = [];
      for (let k = 0; k < 12; k++) {
        const a = (k * Math.PI) / 6; // 奇數＝步道頂點(1.8)，偶數＝邊中點(1.559)
        const rad = k % 2 === 1 ? 1.8 : 1.8 * Math.cos(Math.PI / 6);
        const idx = addNode(cx + Math.cos(a) * rad, TOP + 0.05, cz + Math.sin(a) * rad, isl.id);
        ring.push(idx);
        if (k % 2 === 0) {
          const ea = Math.round(a / (Math.PI / 3)) % 6;
          keyOf.set(isl.id + ':e' + ((ea % 6) + 6) % 6, idx);
        }
      }
      for (let k = 0; k < 12; k++) link(ring[k], ring[(k + 1) % 12]);
    }
    for (const [a, b] of pairs) {
      const ca = axialToWorld(a.q, a.r), cb = axialToWorld(b.q, b.r);
      const dir = { x: cb.x - ca.x, z: cb.z - ca.z };
      const L = Math.hypot(dir.x, dir.z); dir.x /= L; dir.z /= L;
      const ea = Math.round(Math.atan2(dir.z, dir.x) / (Math.PI / 3));
      const eb = Math.round(Math.atan2(-dir.z, -dir.x) / (Math.PI / 3));
      const na = keyOf.get(a.id + ':e' + ((ea % 6) + 6) % 6);
      const nb = keyOf.get(b.id + ':e' + ((eb % 6) + 6) % 6);
      if (na == null || nb == null) throw new Error('橋樑路網節點缺失：' + a.name + '↔' + b.name);
      const mx = (nodes[na].x + nodes[nb].x) / 2, mz = (nodes[na].z + nodes[nb].z) / 2;
      const mid = addNode(mx, TOP + 0.03 + 0.05 + 0.04, mz, a.id + '~' + b.id); // 橋拱頂行走高度，不穿橋
      link(na, mid); link(mid, nb);

      if (!A || !B) throw new Error('船線端點無對應島嶼：' + f.id);
      let ba = -1, bb = -1, bd = Infinity;
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].island !== A.id) continue;
        for (let j = 0; j < nodes.length; j++) {
          if (nodes[j].island !== B.id) continue;
          const dd = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].z - nodes[j].z);
          if (dd < bd) { bd = dd; ba = i; bb = j; }
        }

      if (ba === -1) throw new Error('船線找不到靠岸節點：' + f.id);
      link(ba, bb);
    }
    return { nodes, adj };
  }

    const dist = new Array(state.net.nodes.length).fill(Infinity);

    const done = new Set(); dist[from] = 0;
    for (;;) {
      let u = -1, best = Infinity;
      for (let i = 0; i < dist.length; i++) if (!done.has(i) && dist[i] < best) { best = dist[i]; u = i; }
      if (u === -1 || u === to) break;
      done.add(u);
      for (const { to: v, w } of state.net.adj.get(u)) {
        if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
      }
    }
    if (!isFinite(dist[to])) return null;
    const path = []; let c = to;
    while (c !== -1) { path.unshift(c); c = prev[c]; }
    return path;

        part('glowsphere', Math.cos(ang) * 0.42, 0.44, Math.sin(ang) * 0.42, 0.055, 0.055, 0.055, PAL.yellow);
      }
      for (let i = 0; i < 4; i++) part('box', 0, 0.33, 0, 0.36, 0.03, 0.06, PAL.cream, { ry: i * Math.PI / 4 });
    },
    museum() {
      const a = kitCtx.accent;
      part('box', 0, 0.04, 0, 0.98, 0.08, 0.74, PAL.stone);
      part('box', 0, 0.36, 0, 0.8, 0.56, 0.62, PAL.cream);
      for (const sx of [-0.3, -0.1, 0.1, 0.3]) part('cylinder', sx, 0.32, 0.34, 0.055, 0.44, 0.055, PAL.cream);
      part('prism', 0, 0.72, 0.06, 0.9, 0.3, 0.44, PAL.stone, { rx: Math.PI / 2 });
      part('dome', 0, 0.75, -0.08, 0.32, 0.28, 0.32, a);
      part('sphere', 0, 0.92, -0.08, 0.08, 0.08, 0.08, PAL.yellow);
      part('box', 0, 0.16, 0.32, 0.16, 0.24, 0.035, PAL.wood);
      part('glowbox', 0.26, 0.42, 0.335, 0.16, 0.16, 0.025, PAL.glass);
      part('box', 0.26, 0.31, 0.345, 0.2, 0.04, 0.02, a);
    }
  };

  for (const name of MODEL_NAMES) {
    if (typeof MODELS[name] !== 'function') throw new Error('模型原型缺少實作：' + name);
  }
  for (const name of Object.keys(MODELS)) {
    if (!MODEL_NAMES.has(name)) throw new Error('模型原型未列入 DATA.meta.modelPrototypes：' + name);
  }

  /* ---------- 6.5 主要樹木與街道家具 ---------- */
  function addKitTree(x, z, type, scale, rng, islandId) {
    kitBegin(x, z, TOP, scale, rng() * Math.PI * 2, null, islandId, rng);
    part('cylinder', 0, 0.15, 0, 0.11, 0.3, 0.11, PAL.wood, { detail: 1 });
    if (type === 'pine') {
      part('cone', 0, 0.46, 0, 0.5, 0.34, 0.5, PAL.leaf3, { detail: 1 });
      part('cone', 0, 0.62, 0, 0.42, 0.32, 0.42, PAL.leaf2, { detail: 1 });
      part('cone', 0, 0.78, 0, 0.32, 0.3, 0.32, PAL.leaf1, { detail: 1 });
    } else if (type === 'cherry') {
      part('sphere', 0, 0.52, 0, 0.56, 0.4, 0.56, PAL.pink, { detail: 1 });
      part('sphere', -0.18, 0.44, 0.05, 0.34, 0.28, 0.34, '#f7cad7', { detail: 1 });
      part('sphere', 0.2, 0.46, -0.08, 0.32, 0.26, 0.32, PAL.pink, { detail: 1 });
      part('ico', 0.02, 0.62, 0.06, 0.28, 0.22, 0.28, '#f7cad7', { detail: 1 });
    } else if (type === 'willow') {
      part('dome', 0, 0.48, 0, 0.66, 0.5, 0.66, PAL.leaf1, { detail: 1 });
      for (let i = 0; i < 5; i++) {
        const ang = i * Math.PI * 2 / 5;
        part('box', Math.cos(ang) * 0.24, 0.36, Math.sin(ang) * 0.24, 0.05, 0.36, 0.05, PAL.leaf2, { detail: 1, rz: Math.cos(ang) * 0.25 });
      }
      part('sphere', 0.1, 0.62, 0, 0.28, 0.22, 0.28, PAL.leaf3, { detail: 1 });
    } else if (type === 'fruit') {
      part('sphere', 0, 0.5, 0, 0.54, 0.4, 0.54, PAL.leaf1, { detail: 1 });
      part('sphere', -0.18, 0.52, 0.04, 0.34, 0.28, 0.34, PAL.leaf2, { detail: 1 });
      part('sphere', 0.16, 0.5, -0.08, 0.32, 0.26, 0.32, PAL.leaf3, { detail: 1 });
      for (const f of [[-0.1, 0.46, 0.24], [0.2, 0.52, 0.2], [0.02, 0.58, -0.2]]) {
        part('sphere', f[0], f[1], f[2], 0.06, 0.06, 0.06, f[1] > 0.5 ? PAL.yellow : PAL.coral, { detail: 1 });
      }
    } else {
      part('cylinder', 0.04, 0.36, 0, 0.09, 0.56, 0.09, PAL.wood, { detail: 1, rz: -0.12 });
      for (let i = 0; i < 5; i++) {
        const ang = i * Math.PI * 2 / 5;
        part('box', 0.04 + Math.cos(ang) * 0.22, 0.66, Math.sin(ang) * 0.22, 0.36, 0.035, 0.12, i % 2 ? PAL.leaf1 : PAL.leaf2, { detail: 1, ry: -ang, rz: 0.2 });
      }
      part('sphere', 0.04, 0.64, 0, 0.1, 0.1, 0.1, PAL.yellow, { detail: 1 });
    }
    kitCtx = null;
  }

  function addLamp(x, z, yaw, islandId, rng) {
    kitBegin(x, z, TOP, 1, yaw, null, islandId, rng);
    part('cylinder', 0, 0.24, 0, 0.05, 0.48, 0.05, PAL.ink, { detail: 2 });
    part('glowsphere', 0, 0.52, 0, 0.13, 0.13, 0.13, PAL.yellow, { detail: 2 });
    part('hip', 0, 0.61, 0, 0.16, 0.1, 0.16, PAL.ink, { detail: 2 });
    kitCtx = null;
  }
  function addPot(x, z, islandId, rng) {
    kitBegin(x, z, TOP, 1, rng() * Math.PI * 2, null, islandId, rng);
    part('cylinder', 0, 0.08, 0, 0.18, 0.16, 0.18, PAL.coral, { detail: 2 });
    part('ico', 0, 0.23, 0, 0.26, 0.22, 0.26, PAL.leaf2, { detail: 2 });
    part('ico', 0.07, 0.31, 0.03, 0.12, 0.1, 0.12, PAL.leaf1, { detail: 2 });
    kitCtx = null;
  }
  function addBench(x, z, yaw, islandId, rng) {
    kitBegin(x, z, TOP, 1, yaw, null, islandId, rng);
    part('box', 0, 0.2, 0, 0.44, 0.05, 0.17, PAL.wood, { detail: 2 });
    part('box', 0, 0.31, -0.08, 0.44, 0.18, 0.04, PAL.wood, { detail: 2 });
    for (const sx of [-1, 1]) {
      part('box', sx * 0.16, 0.1, 0, 0.04, 0.2, 0.14, PAL.ink, { detail: 2 });
      part('box', sx * 0.16, 0.27, -0.08, 0.04, 0.18, 0.035, PAL.ink, { detail: 2 });
    }
    kitCtx = null;
  }
  function addRimLight(x, z, islandId, rng) {
    kitBegin(x, z, TOP, 1, 0, null, islandId, rng);
    part('glowsphere', 0, 0.05, 0, 0.05, 0.05, 0.05, PAL.yellow, { detail: 2 });
    kitCtx = null;
  }

  /* ---------- 島內配置：主要模型、交錯格子、樹木與家具 ---------- */
  const ITEM_BY_ID = new Map(DATA.items.map((it) => [it.id, it]));
  const ITEM_SLOTS = [
    { x: -0.95, z: -0.12 }, { x: 0.95, z: -0.12 },
    { x: -0.84, z: 0.5 }, { x: 0.84, z: 0.5 }, { x: 0, z: 0.72 }
  ];
  const placedFree = (list, x, z, r) => !list.some((p) => Math.hypot(p.x - x, p.z - z) < p.r + r + 0.015);

  function placeItem(itemId, ox, oz, lx, lz, scale, yaw, isl) {
    const it = ITEM_BY_ID.get(itemId);
    if (!it) throw new Error('找不到項目模型資料：' + itemId);
    const model = MODELS[it.model];
    if (!model) throw new Error('模型原型未實作：' + it.model);
    const rng = rngFor('model:' + it.id);
    kitBegin(ox + lx, oz + lz, TOP, scale, yaw, it.id, isl.id, rng, isl.color);
    model();
    kitCtx = null;
  }

  const lampPositions = [];
  for (const isl of DATA.islands) {
    const { x: ox, z: oz } = axialToWorld(isl.q, isl.r);
    const rng = rngFor('island:' + isl.id);
    const placed = [];
    const heroId = isl.heroItemId || isl.itemIds[0] || null;
    const others = isl.itemIds.filter((id) => id !== heroId);
    const scale = others.length >= 4 ? 0.47 : others.length >= 2 ? 0.55 : 0.62;
    if (heroId && isl.icon !== 'todo') {
      placeItem(heroId, ox, oz, 0, -0.58, MODEL_CFG.heroScale, 0, isl);
      placed.push({ x: 0, z: -0.58, r: 0.58 });
    } else {
      placed.push({ x: 0, z: -0.2, r: 0.44 });
      kitBegin(ox, oz - 0.2, TOP, 0.82, 0, null, isl.id, rng, isl.color);
      MODELS.garden();
      kitCtx = null;
    }
    if (others.length > ITEM_SLOTS.length) throw new Error('島嶼項目超過配置格位：' + isl.id);
    let placedOthers = 0;
    others.forEach((id, i) => {
      const slot = ITEM_SLOTS[i];
      if (!slot) return;
      if (!placedFree(placed, slot.x, slot.z, 0.3)) return;
      const yaw = (rng() - 0.5) * 0.34;
      placeItem(id, ox, oz, slot.x, slot.z, scale, yaw, isl);
      placed.push({ x: slot.x, z: slot.z, r: 0.3 });
      placedOthers++;
    });
    if (placedOthers !== others.length) throw new Error('島內配置空間不足：' + isl.id);

    const treeCount = 4 + (rng() < 0.66 ? 1 : 0) + (rng() < 0.32 ? 1 : 0);
    let made = 0;
    for (let attempt = 0; attempt < 96 && made < treeCount; attempt++) {
      const ang = attempt * 2.399963 + rng() * 0.16;
      const rad = attempt < 52 ? 1.42 : 1.32;
      const tx = Math.cos(ang) * rad, tz = Math.sin(ang) * rad;
      if (!placedFree(placed, tx, tz, 0.23)) continue;
      addKitTree(ox + tx, oz + tz, isl.treeType, 0.78 + rng() * 0.22, rng, isl.id);
      placed.push({ x: tx, z: tz, r: 0.23 });
      made++;
    }
    if (made < 4) throw new Error('主要樹木不足（需 4–6 棵）：' + isl.id);

    for (let k = 0; k < 6; k++) {
      const ang = Math.PI / 6 + k * Math.PI / 3;
      const lxp = ox + Math.cos(ang) * 1.9, lzp = oz + Math.sin(ang) * 1.9;
      addLamp(lxp, lzp, -ang, isl.id, rng);
      lampPositions.push([lxp, lzp]);
    }
    let pots = 0;
    for (let attempt = 0; attempt < 84 && pots < 3; attempt++) {
      const ang = attempt * 2.399963 + 0.6;
      const pr = [1.53, 1.45, 1.59][attempt % 3];
      const px = Math.cos(ang) * pr, pz = Math.sin(ang) * pr;
      if (!placedFree(placed, px, pz, 0.16)) continue;
      addPot(ox + px, oz + pz, isl.id, rng);
      placed.push({ x: px, z: pz, r: 0.16 });
      pots++;
    }
    let benches = 0;
    for (let attempt = 0; attempt < 84 && benches < 2; attempt++) {
      const ang = attempt * 2.399963 + 1.1;
      const br = [1.36, 1.46, 1.28][attempt % 3];
      const bx = Math.cos(ang) * br, bz = Math.sin(ang) * br;
      if (!placedFree(placed, bx, bz, 0.22)) continue;
      addBench(ox + bx, oz + bz, -ang, isl.id, rng);
      placed.push({ x: bx, z: bz, r: 0.22 });
      benches++;
    }
    for (let k = 0; k < 12; k++) {
      const ang = k * Math.PI / 6;
      const rad = k % 2 === 1 ? 1.86 : 1.86 * Math.cos(Math.PI / 6);
      addRimLight(ox + Math.cos(ang) * rad, oz + Math.sin(ang) * rad, isl.id, rng);
    }
  }

  /* ---------- 建立 InstancedMesh 與模型歸屬索引 ---------- */
  const kitMeshList = [];
  const byItem = new Map(), byMesh = new Map();
  {
    const groups = new Map();
    for (const p of kitParts) {
      const key = p.kind + '|' + p.materialClass + '|' + p.detailLevel;
      let g = groups.get(key);
      if (!g) { g = { kind: p.kind, mat: p.materialClass, detail: p.detailLevel, parts: [] }; groups.set(key, g); }
      g.parts.push(p);
    }
    for (const g of groups.values()) {
      const mesh = new THREE.InstancedMesh(KG[g.kind], g.mat === 'glow' ? MAT_GLOW : MAT_SOLID, g.parts.length);
      const itemIds = new Array(g.parts.length).fill(null);
      const islandIds = new Array(g.parts.length).fill(null);
      const baseColors = new Array(g.parts.length);
      g.parts.forEach((p, i) => {
        mesh.setMatrixAt(i, p.matrix);
        mesh.setColorAt(i, p.color);
        itemIds[i] = p.itemId; islandIds[i] = p.islandId;
        baseColors[i] = p.color.clone();
        if (p.itemId) {
          if (!byItem.has(p.itemId)) byItem.set(p.itemId, []);
          byItem.get(p.itemId).push({ mesh, instanceId: i, baseColor: p.color.clone() });
        }
      });
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.castShadow = g.detail === 0;
      mesh.receiveShadow = g.detail === 0;
      mesh.userData.kind = g.kind;
      mesh.userData.materialClass = g.mat;
      mesh.userData.detailLevel = g.detail;
      mesh.userData.itemIds = itemIds;
      mesh.userData.islandIds = islandIds;
      mesh.userData.baseColors = baseColors;
      byMesh.set(mesh, { itemIds, islandIds });
      world.add(mesh);
      kitMeshList.push(mesh);
    }
  }
  if (byItem.size !== DATA.items.length) {
    throw new Error('模型歸屬索引不完整：' + byItem.size + '／' + DATA.items.length + ' 個項目');
  }
  state.modelMeshes = kitMeshList;
  state.modelIndex = { byItem, byMesh, items: ITEM_BY_ID };
  window.__modelIndex = state.modelIndex;
  $('#modelstats').textContent = '階段 2：' + Object.keys(MODELS).length + ' 種模型原型・' + kitParts.length +
    ' 個零件・靜態零件庫 ' + kitMeshList.length + ' 個 InstancedMesh';
  console.info('[island-3d stage2]', {
    prototypes: Object.keys(MODELS).length, parts: kitParts.length,
    kitInstancedMeshes: kitMeshList.length, items: ITEM_BY_ID.size,
    byItem: byItem.size, mode: DATA.meta.mode
  });

  const LAMP_POOL_MAT = new THREE.MeshBasicMaterial({
    color: '#ffc777', transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide, fog: false
  });
  const lampPoolGeo = new THREE.CircleGeometry(0.32, 12).rotateX(-Math.PI / 2);
  const lampPoolMesh = new THREE.InstancedMesh(lampPoolGeo, LAMP_POOL_MAT, lampPositions.length);
  {
    const o = new THREE.Object3D();
    lampPositions.forEach((p, i) => {
      o.position.set(p[0], TOP + 0.03, p[1]);
      o.rotation.set(0, 0, 0); o.scale.setScalar(1);
      o.updateMatrix(); lampPoolMesh.setMatrixAt(i, o.matrix);
    });
    lampPoolMesh.instanceMatrix.needsUpdate = true;
    lampPoolMesh.renderOrder = 3;
    world.add(lampPoolMesh);
  }

  /* ---------- 5.9 遠景：盆地地形、背景樹 ---------- */
  loadmsg('佈置盆地地形與背景樹…');
  const terrainNoise = new SimplexNoise({ random: mulberry32(hashSeed('terrain-noise')) });
  const smoothstep = (a, b, x) => {
    const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const fbm2 = (x, z) => {
    let amp = 0.5, freq = 1, sum = 0, norm = 0;
    for (let i = 0; i < 4; i++) {
      sum += terrainNoise.noise(x * freq, z * freq) * amp;
      norm += amp; amp *= 0.5; freq *= 2.02;
    }
    return sum / norm;
  };
  function terrainHeight(x, z) {
    const r = Math.hypot(x, z);
    let h = -2.6 + fbm2(x * 0.04, z * 0.04) * 0.7;
    const ridge = smoothstep(25, 52, r);
    h += ridge * (4.2 + fbm2(x * 0.028 + 11, z * 0.028 - 7) * 5.5 + Math.abs(fbm2(x * 0.09, z * 0.09)) * 2);
    h = THREE.MathUtils.lerp(h, Math.round(h * 2) / 2, 0.34 * smoothstep(27, 42, r));
    const front = (x * 0.24 + z * 0.87) / Math.max(r, 0.001);
    h *= 1 - 0.34 * smoothstep(20, 46, r) * smoothstep(0.12, 0.82, front);
    h = THREE.MathUtils.lerp(h, -2.4, smoothstep(66, 84, r));
    return h;
  }
  {
    const geo = new THREE.PlaneGeometry(170, 170, 160, 160).rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const cRiver = new THREE.Color('#8fb3ad'), cSand = new THREE.Color('#d9c9a3');
    const cField = new THREE.Color('#aec493'), cGrass = new THREE.Color('#a3b986');
    const cForest = new THREE.Color('#6f8a62'), cRock = new THREE.Color('#b2a38d');
    const col = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      const h = terrainHeight(x, z);
      pos.setY(i, h);
      if (h < 0.15) col.copy(cRiver);
      else if (h < 0.7) col.copy(cSand);
      else if (h < 1.6) col.copy(cField);
      else if (h < 3.0) col.copy(cGrass);
      else if (h < 5.2) col.copy(cForest);
      else col.copy(cRock);
      col.multiplyScalar(0.94 + 0.12 * (fbm2(x * 0.11 + 5, z * 0.11 - 3) + 0.5));
      colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      vertexColors: true, flatShading: true, roughness: 0.97, metalness: 0
    }));
    terrain.position.set(worldCenter.x, 0, worldCenter.z);
    terrain.receiveShadow = false;
    world.add(terrain);
  }

  /* 背景樹：針葉 3 cone、闊葉 4 ico，固定種子微擾，不投影 */
  {
    const treeRng = rngFor('background-trees');
    const nonIndexed = (g) => (g.index ? g.toNonIndexed() : g);
    const coniferGeo = (() => {
      const gs = [];
      const trunk = new THREE.CylinderGeometry(0.06, 0.09, 0.5, 5); trunk.translate(0, 0.25, 0); gs.push(nonIndexed(trunk));
      const c1 = new THREE.ConeGeometry(0.48, 0.9, 6); c1.translate(0, 0.78, 0); gs.push(nonIndexed(c1));
      const c2 = new THREE.ConeGeometry(0.38, 0.78, 6); c2.translate(0, 1.1, 0); gs.push(nonIndexed(c2));
      const c3 = new THREE.ConeGeometry(0.27, 0.64, 6); c3.translate(0, 1.4, 0); gs.push(nonIndexed(c3));
      return BufferGeometryUtils.mergeGeometries(gs, false);
    })();
    const broadGeo = (() => {
      const gs = [];
      const trunk = new THREE.CylinderGeometry(0.07, 0.1, 0.55, 5); trunk.translate(0, 0.27, 0); gs.push(nonIndexed(trunk));
      for (let i = 0; i < 4; i++) {
        const blob = new THREE.IcosahedronGeometry(0.38 + treeRng() * 0.12, 0);
        blob.translate((treeRng() - 0.5) * 0.5, 0.72 + treeRng() * 0.3, (treeRng() - 0.5) * 0.5);
        gs.push(nonIndexed(blob));
      }
      return BufferGeometryUtils.mergeGeometries(gs, false);
    })();
    const coniferPos = [], broadPos = [];
    const target = isMobile ? MODEL_CFG.backgroundTreesMobile : MODEL_CFG.backgroundTreesDesktop;
    for (let attempt = 0; attempt < target * 6 && coniferPos.length + broadPos.length < target; attempt++) {
      const ang = treeRng() * Math.PI * 2;
      const rad = 17 + Math.pow(treeRng(), 0.82) * 38;
      const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
      const h = terrainHeight(x, z);
      if (h < 0.3) continue;
      const slope = Math.hypot(terrainHeight(x + 0.45, z) - h, terrainHeight(x, z + 0.45) - h) / 0.45;
      if (slope > 1.15) continue;
      const rec = { x: worldCenter.x + x, y: h, z: worldCenter.z + z,
        s: 0.65 + treeRng() * 0.85, rot: treeRng() * Math.PI * 2,
        c: new THREE.Color([PAL.leaf1, PAL.leaf2, PAL.leaf3][Math.floor(treeRng() * 3)]).multiplyScalar(0.82 + treeRng() * 0.25) };
      (treeRng() < 0.52 ? coniferPos : broadPos).push(rec);
    }
    const treeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.96, flatShading: true });
    const mkTrees = (list, geo) => {
      const im = new THREE.InstancedMesh(geo, treeMat, list.length);
      const o = new THREE.Object3D();
      list.forEach((t, i) => {
        o.position.set(t.x, t.y, t.z); o.rotation.set(0, t.rot, 0); o.scale.setScalar(t.s);
        o.updateMatrix(); im.setMatrixAt(i, o.matrix); im.setColorAt(i, t.c);
      });
      im.instanceMatrix.needsUpdate = true;
      if (im.instanceColor) im.instanceColor.needsUpdate = true;
      im.castShadow = false; im.receiveShadow = false;
      world.add(im);
      return im;
    };
    mkTrees(coniferPos, coniferGeo);
    mkTrees(broadPos, broadGeo);
  }

  /* 12 團雲：每團多顆球，沿 +x 漂移繞回 */
  const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0, flatShading: true });
  const cloudPuffGeo = new THREE.SphereGeometry(0.5, 8, 6);
  const cloudDefs = [];
  let puffTotal = 0;
  {
    const crng = rngFor('clouds');
    for (let c = 0; c < 12; c++) {
      const ang = crng() * Math.PI * 2;
      const rad = 28 + crng() * 38;
      const def = { x: Math.cos(ang) * rad, z: Math.sin(ang) * rad, y: 13 + crng() * 9, puffs: [] };
      const n = 4 + Math.floor(crng() * 3);
      for (let i = 0; i < n; i++) {
        def.puffs.push({
          x: (crng() - 0.5) * 4.4, y: (crng() - 0.5) * 1.1, z: (crng() - 0.5) * 2.2,
          s: 1.2 + crng() * 1.7
        });
      }
      puffTotal += n;
      cloudDefs.push(def);
    }
  }
  const cloudMesh = new THREE.InstancedMesh(cloudPuffGeo, cloudMat, puffTotal);
  cloudMesh.frustumCulled = false;
  world.add(cloudMesh);
  const _co = new THREE.Object3D();
  function updateClouds(drift) {
    let i = 0;
    for (const def of cloudDefs) {
      const cx = worldCenter.x + ((def.x + 72 + drift) % 144 + 144) % 144 - 72;
      for (const p of def.puffs) {
        _co.position.set(cx + p.x, def.y + p.y, worldCenter.z + def.z + p.z);
        _co.rotation.set(0, 0, 0); _co.scale.setScalar(p.s);
        _co.updateMatrix(); cloudMesh.setMatrixAt(i++, _co.matrix);
      }
    }
    cloudMesh.instanceMatrix.needsUpdate = true;
  }
  updateClouds(0);

  /* 三圈遠山剪影帶 */
  const mountainMats = [], mountainBase = [];
  {
    const baseCols = ['#93a89f', '#a2b2ac', '#b4c0b9'];
    const mrng = rngFor('mountains');
    for (let ring = 0; ring < 3; ring++) {
      const gs = [];
      const count = 48;
      const radius = 92 + ring * 18;
      for (let k = 0; k < count; k++) {
        const ang = k * Math.PI * 2 / count + mrng() * 0.05;
        const h = 5 + ring * 2.4 + mrng() * (5 + ring * 2);
        const rad = 2.6 + mrng() * 3.6;
        const cone = new THREE.ConeGeometry(rad, h, 4 + Math.floor(mrng() * 3));
        cone.rotateY(mrng() * Math.PI);
        cone.translate(Math.cos(ang) * radius, h / 2 - 0.4, Math.sin(ang) * radius);
        gs.push(cone);
      }
      const geo = BufferGeometryUtils.mergeGeometries(gs, false);
      const mat = new THREE.MeshBasicMaterial({ color: baseCols[ring], fog: false, depthWrite: false, transparent: true, opacity: 0.92 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(worldCenter.x, 0, worldCenter.z);
      mesh.renderOrder = -1;
      world.add(mesh);
      mountainMats.push(mat); mountainBase.push(new THREE.Color(baseCols[ring]));
    }
  }

  /* 海面點綴：燈塔、小島、帆船 */
  loadmsg('點綴海上燈塔與帆船…');
  const SEA_GLOW = new THREE.MeshStandardMaterial({
    color: 0xfff8f4, roughness: 0.5, metalness: 0,
    emissive: new THREE.Color('#ffc777'), emissiveIntensity: 0
  });
  const seaGroup = new THREE.Group(); world.add(seaGroup);
  {
    const rockMat = new THREE.MeshStandardMaterial({ color: '#8b8175', roughness: 0.96, flatShading: true });
    const whiteMat = new THREE.MeshStandardMaterial({ color: '#fff8f4', roughness: 0.8 });
    const redMat = new THREE.MeshStandardMaterial({ color: '#db6a41', roughness: 0.8 });
    const leafMat = new THREE.MeshStandardMaterial({ color: PAL.leaf2, roughness: 0.95, flatShading: true });
    const woodMat = new THREE.MeshStandardMaterial({ color: PAL.wood, roughness: 0.9 });
    const lhAngle = 0.55, lhR = 31;
    const lx = worldCenter.x + Math.cos(lhAngle) * lhR, lz = worldCenter.z + Math.sin(lhAngle) * lhR;
    const rock = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.8, 0.55, 7), rockMat);
    rock.position.set(lx, WATER_Y + 0.14, lz); seaGroup.add(rock);
    const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.8, 2.4, 10), whiteMat);
    tower.position.set(lx, WATER_Y + 1.6, lz); seaGroup.add(tower);
    for (const yy of [0.95, 1.95]) {
      const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.74, 0.7, 0.34, 10), redMat);
      stripe.position.set(lx, WATER_Y + yy, lz); seaGroup.add(stripe);
    }
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.34, 10, 8), SEA_GLOW);
    lamp.position.set(lx, WATER_Y + 2.95, lz); seaGroup.add(lamp);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.62, 0.55, 10), redMat);
    cap.position.set(lx, WATER_Y + 3.3, lz); seaGroup.add(cap);

    const islets = [
      { a: 2.35, r: 36.5, s: 1.0 }, { a: 3.9, r: 33.5, s: 0.72 }, { a: 5.25, r: 40, s: 1.2 }
    ];
    for (const def of islets) {
      const ix = worldCenter.x + Math.cos(def.a) * def.r, iz = worldCenter.z + Math.sin(def.a) * def.r;
      const isl = new THREE.Mesh(new THREE.IcosahedronGeometry(1.25 * def.s, 0), rockMat);
      isl.position.set(ix, WATER_Y + 0.25 * def.s, iz);
      isl.scale.set(1.45, 0.55, 1.15);
      seaGroup.add(isl);
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.13, 1.1, 6).translate(0, 0.55, 0), woodMat);
      trunk.position.set(ix + 0.35, WATER_Y + 0.55 * def.s, iz + 0.2);
      seaGroup.add(trunk);
      for (let k = 0; k < 4; k++) {
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.35, 4), leafMat);
        leaf.position.set(ix + 0.35, WATER_Y + 1.35 * def.s, iz + 0.2);
        leaf.rotation.set(0.55, k * Math.PI / 2, 0);
        leaf.scale.setScalar(def.s);
        seaGroup.add(leaf);
      }
    }
  }
  const boatDefs = [];
  {
    const hullMat = new THREE.MeshStandardMaterial({ color: PAL.teal, roughness: 0.75 });
    const deckMat = new THREE.MeshStandardMaterial({ color: PAL.wood, roughness: 0.85 });
    const sailMat = new THREE.MeshStandardMaterial({ color: PAL.cream, roughness: 0.9, side: THREE.DoubleSide });
    const flagMat = new THREE.MeshStandardMaterial({ color: PAL.coral, roughness: 0.9 });
    const defs = [{ a: 1.15, r: 34, speed: 0.011, phase: 0.4 }, { a: 3.05, r: 37, speed: -0.008, phase: 2.1 }];
    for (const d of defs) {
      const g = new THREE.Group();
      const hull = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.34, 0.6), hullMat);
      hull.position.y = 0.15; g.add(hull);
      const bow = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.5, 4), hullMat);
      bow.rotation.z = -Math.PI / 2; bow.position.set(0.9, 0.15, 0); g.add(bow);
      const deck = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.5), deckMat);
      deck.position.y = 0.34; g.add(deck);
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.8, 6), deckMat);
      mast.position.set(0.08, 1.24, 0); g.add(mast);
      const sail = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.05, 3, 1), sailMat);
      sail.rotation.set(Math.PI / 2, 0, 0.45);
      sail.position.set(0.35, 1.1, 0);
      sail.scale.set(0.9, 1.55, 1);
      g.add(sail);
      const flag = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.14, 0.02), flagMat);
      flag.position.set(0.22, 2.0, 0); g.add(flag);
      g.userData.def = d;
      boatDefs.push(g);
      seaGroup.add(g);
    }
  }
  function updateBoats(t) {
    for (const g of boatDefs) {
      const d = g.userData.def;
      const ang = d.a + t * d.speed;
      g.position.set(
        worldCenter.x + Math.cos(ang) * d.r,
        WATER_Y + 0.02 + Math.sin(t * 0.75 + d.phase) * 0.055,
        worldCenter.z + Math.sin(ang) * d.r
      );
      g.rotation.y = -ang - Math.sign(d.speed) * Math.PI / 2;
      g.rotation.z = Math.sin(t * 0.6 + d.phase) * 0.035;
    }
  }
  updateBoats(0);

  /* ---------- 基本 LOD：相機距離 ≥26 時隱藏細小裝飾（detailLevel 2） ---------- */
  let lodHidden = null;
  function updateModelLOD() {
    const dist = camera.position.distanceTo(controls.target);
    const hide = dist >= MODEL_CFG.nearDetailDistance;
    if (hide === lodHidden) return false;
    lodHidden = hide;
    for (const mesh of kitMeshList) {
      if (mesh.userData.detailLevel >= 2) mesh.visible = !hide;
    }
    lampPoolMesh.visible = !hide;
    return true;
  }

  /* ---------- 全景構圖（依實際島群與標籤外框找最小可視距離） ---------- */
  loadmsg('校正全景構圖…');
  function framePanorama() {
    const box = new THREE.Box3().setFromObject(islandGroup);
    const center = box.getCenter(new THREE.Vector3());
    const dir = new THREE.Vector3(...DATA.config.camera.panoramaDir).normalize();
    const up = new THREE.Vector3(0, 1, 0).addScaledVector(dir, -dir.y).normalize();
    const target = center.clone().addScaledVector(up, -DATA.config.camera.panoramaLift);
    const items = [];
    for (const isl of DATA.islands) {
      const { x, z } = axialToWorld(isl.q, isl.r);
      for (let k = 0; k < 6; k++) {
        const a = Math.PI / 6 + k * Math.PI / 3;
        items.push({ p: new THREE.Vector3(x + Math.cos(a) * (R + 0.7), WATER_Y, z + Math.sin(a) * (R + 0.7)), hw: 6, hh: 6, ui: false });
      }
    }
    for (const p of labelAnchors) items.push({ p, hw: 54, hh: 12, ui: true });
    const uiRects = ['#brand', '#timebar'].map((sel) => {
      const r = $(sel).getBoundingClientRect();
      return { left: r.left, top: r.top, right: r.right, bottom: r.bottom };
    });
    const margin = 10;
    const tmp = new THREE.Vector3();
    function fits(dist) {
      camera.position.copy(target).addScaledVector(dir, dist);
      camera.lookAt(target);
      camera.updateMatrixWorld(true);
      for (const o of items) {
        tmp.copy(o.p).project(camera);
        if (tmp.z < -1 || tmp.z > 1) return false;
        const sx = (tmp.x * 0.5 + 0.5) * innerWidth;
        const sy = (-tmp.y * 0.5 + 0.5) * innerHeight;
        if (sx - o.hw < margin || sx + o.hw > innerWidth - margin) return false;
        if (sy - o.hh < margin || sy + o.hh > innerHeight - margin) return false;
        for (const r of uiRects) {
          if (!o.ui) continue;
          if (sx + o.hw > r.left && sx - o.hw < r.right && sy + o.hh > r.top && sy - o.hh < r.bottom) return false;
        }
      }
      return true;
    }
    let lo = DATA.config.camera.panoramaMinDistance;
    let hi = DATA.config.camera.panoramaMaxDistance;
    if (!fits(hi)) { // 極端視窗：至少保持全部內容在畫面內
      lo = hi; hi = hi * 1.6;
    }
    for (let i = 0; i < 32; i++) {
      const mid = (lo + hi) / 2;
      if (fits(mid)) hi = mid; else lo = mid;
    }
    const dist = hi;
    controls.target.copy(target);
    controls.maxDistance = Math.max(DATA.config.camera.maxDistance, Math.ceil(dist + 10));
    camera.position.copy(target).addScaledVector(dir, dist);
    controls.update();
  }
  framePanorama();

  /* ---------- 日夜 ---------- */
  const _ca = new THREE.Color(), _cb = new THREE.Color();
  const SHALLOW_LIGHT = new THREE.Color('#eaf7f7');
  const KF = DATA.environment.keyframes;
  const ENV = { top: new THREE.Color(), hor: new THREE.Color(), sun: new THREE.Color(), hs: new THREE.Color(), hg: new THREE.Color(), water: new THREE.Color(), sunI: 0, hemiI: 0, night: 0 };
  function envAt(minutes) {
    const m = ((minutes % 1440) + 1440) % 1440;
    let i = 0;
    while (i < KF.length - 2 && KF[i + 1].m <= m) i++;
    const a = KF[i], b = KF[i + 1];
    const t = THREE.MathUtils.clamp((m - a.m) / (b.m - a.m), 0, 1);
    const mix = (out, ca, cb) => out.copy(_ca.set(ca)).lerp(_cb.set(cb), t);
    mix(ENV.top, a.top, b.top); mix(ENV.hor, a.hor, b.hor); mix(ENV.sun, a.sun, b.sun);
    ENV.sunI = a.sunI + (b.sunI - a.sunI) * t;
    mix(ENV.hs, a.hs, b.hs); mix(ENV.hg, a.hg, b.hg);
    ENV.hemiI = a.hemiI + (b.hemiI - a.hemiI) * t;
    ENV.night = a.night + (b.night - a.night) * t;
    mix(ENV.water, a.water, b.water);
    return ENV;
  }
  const _sd = new THREE.Vector3();
  function sunDir(minutes) {
    const t = THREE.MathUtils.clamp((minutes - 360) / 720, 0, 1);
    const az = Math.PI * (0.15 + 0.7 * t);
    const el = 0.35 + Math.sin(t * Math.PI) * 0.75;
    return _sd.set(Math.cos(az) * Math.cos(el), Math.sin(el), 0.55 * Math.cos(el) + 0.35).normalize();
  }
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const timeBtns = [...document.querySelectorAll('#timebar button')];
  function applyEnv() {
    const e = envAt(state.envMinutes);
    skyUni.uTop.value.copy(e.top); skyUni.uHorizon.value.copy(e.hor);
    skyUni.uSun.value.copy(e.sun); skyUni.uNight.value = e.night;
    const sd = sunDir(Math.floor(state.envMinutes / 10) * 10); // 太陽方位 10 分鐘量化
    skyUni.uSunDir.value.copy(sd);
    sun.position.copy(worldCenter).addScaledVector(sd, 40);
    sun.target.position.copy(worldCenter);
    sun.color.copy(e.sun); sun.intensity = e.sunI;
    hemi.color.copy(e.hs); hemi.groundColor.copy(e.hg); hemi.intensity = e.hemiI;
    scene.fog.color.copy(e.hor);
    waterUni.uTint.value.copy(e.water);
    waterUni.uNight.value = e.night;
    waterUni.fogColor.value.copy(e.hor);
    waterUni.fogNear.value = scene.fog.near;
    waterUni.fogFar.value = scene.fog.far;
    SHALLOW_MAT.color.copy(e.water).lerp(SHALLOW_LIGHT, 0.3);
    FOAM_MAT.opacity = 0.55 * (1 - 0.5 * e.night);
    WALL_MAT.color.copy(WALL_BASE).multiplyScalar(1 - 0.3 * e.night);
    MAT_GLOW.emissiveIntensity = e.night * 3.2;
    SEA_GLOW.emissiveIntensity = e.night * 3.2;
    LAMP_POOL_MAT.opacity = e.night * 0.28;
    cloudMat.color.copy(_ca.set('#ffffff')).lerp(_cb.set(e.hor), 0.12 + 0.18 * e.night);
    for (let i = 0; i < mountainMats.length; i++) {
      mountainMats[i].color.copy(mountainBase[i]).lerp(e.hor, 0.42 + i * 0.18);
    }
  }
  function updateClock() { // 時鐘文字每秒更新一次即可
    const hh = String(Math.floor(state.envMinutes / 60)).padStart(2, '0');
    const mm = String(Math.floor(state.envMinutes % 60)).padStart(2, '0');
    $('#clock').textContent = '展示時間 ' + hh + ':' + mm;
    const cur = Math.round(state.envMinutes) % 1440;
    let bestTarget = null, bestDist = Infinity;
    timeBtns.forEach((btn) => {
      const target = +btn.dataset.m % 1440;
      const d = Math.abs(cur - target);
      const circular = Math.min(d, 1440 - d);
      if (circular < bestDist) { bestDist = circular; bestTarget = target; }
    });
    timeBtns.forEach((btn) => {
      btn.classList.toggle('on', +btn.dataset.m % 1440 === bestTarget);
    });
  }
  timeBtns.forEach((btn) => {
    btn.addEventListener('click', () => { state.envMinutes = +btn.dataset.m % 1440; applyEnv(); persist(); dirty = true; });
  });
  applyEnv();

  /* ---------- 選取（點島嶼） ---------- */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let downPos = null, fly = null;
  renderer.domElement.addEventListener('pointerdown', (e) => {
    state.userInteracted = true;
    downPos = [e.clientX, e.clientY];
    fly = null; // 使用者接手，取消自動飛行
  });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!downPos) return;
    const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
    downPos = null;
    if (moved > 6) return;
    ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const pickables = islandGroup.children.concat(state.modelMeshes);
    const hits = ray.intersectObjects(pickables, true);
    let id = null, hitItemId = null;
    for (const h of hits) {
      const o = h.object;
      if (o.isInstancedMesh && h.instanceId != null && o.userData.itemIds) {
        const iid = o.userData.itemIds[h.instanceId];
        if (iid) {
          const it = ITEM_BY_ID.get(iid);
          if (it) { id = it.islandId; hitItemId = iid; break; }
        }
        const islId = o.userData.islandIds && o.userData.islandIds[h.instanceId];
        if (islId) { id = islId.split('~')[0]; break; }
      }
      let p = o;
      while (p && !p.userData.islandId) p = p.parent;
      if (p) { id = p.userData.islandId; break; }
    }
    if (id) {
      state.selectedItemId = hitItemId;
      selectIsland(id, true);
    } else {
      state.selectedItemId = null;
      selectIsland(null, false);
    }
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') selectIsland(null, false);
  });

  function selectIsland(id, flyTo) {
    state.selectedIsland = id;
    for (const [key, rec] of state.islandMeshes) {
      const on = key === id;
      rec.topMat.color.copy(rec.baseColor).lerp(CORAL, on ? 0.22 : 0);
      rec.topMat.needsUpdate = false;
    }
    for (const [key, el] of state.labelObjs) el.classList.toggle('sel', key === id);
    const box = $('#info');
    if (!id) { box.classList.remove('show'); dirty = true; return; }
    const isl = DATA.islands.find((i) => i.id === id);
    const p = parkOf(isl.name);
    $('#infoname').textContent = isl.name + '島';
    $('#infosub').textContent = p ? '有 ' + p.count + ' 處親子景點' : '景點資料待補';
    $('#infobody').innerHTML = p
      ? '<ul>' + p.names.map((n) => '<li>' + n + '</li>').join('') + '</ul><p>詳細介紹與導航：後續階段加入卡片。</p>'
      : '<p>這一座島還沒有景點資料，歡迎之後補上在地好去處。</p>';
    box.classList.add('show');
    if (flyTo) {
      const { x, z } = axialToWorld(isl.q, isl.r);
      const target = new THREE.Vector3(x, TOP, z);
      const pos = target.clone().add(new THREE.Vector3(2.75, 5.3, 6.2));
      fly = { t: 0, dur: reducedMotion ? 0 : 0.8, fromT: controls.target.clone(), toT: target, fromP: camera.position.clone(), toP: pos };
      if (reducedMotion) { controls.target.copy(target); camera.position.copy(pos); fly = null; }
    }
    dirty = true;
  }
  $('#infoclose').addEventListener('click', () => selectIsland(null, false));

  /* ---------- 尺寸變化 ---------- */
  new ResizeObserver(() => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    labelRenderer.setSize(innerWidth, innerHeight);
    if (!state.userInteracted && !state.selectedIsland) framePanorama();
    dirty = true;
  }).observe(document.body);

  /* ---------- 主迴圈（統一 simulationTime，dt 上限 0.08） ---------- */
  let simTime = 0, last = performance.now(), lastShown = -1;
  controls.addEventListener('change', () => { dirty = true; });
  setInterval(persist, 5000);

  function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function tick(now) {
    if (state.dead) return;
    requestAnimationFrame(tick);
    const dt = Math.min((now - last) / 1000, 0.08); last = now;
    let adv = true;
    if (document.hidden || reducedMotion) adv = false;
    if (adv) {
      simTime += dt;
      state.envMinutes = (state.envMinutes + dt * DATA.environment.minutesPerSecond) % 1440;
      applyEnv(); // 視覺每幀線性插值，日夜連續
      const shown = Math.floor(state.envMinutes / 10);
      if (shown !== lastShown) { lastShown = shown; updateClock(); }
      waterUni.uTime.value = simTime;
      updateClouds(simTime * 0.35);
      updateBoats(simTime);
      dirty = true;
    }
    if (fly) {
      fly.t += dt;
      const k = easeInOutCubic(Math.min(fly.t / fly.dur, 1));
      controls.target.lerpVectors(fly.fromT, fly.toT, k);
      camera.position.lerpVectors(fly.fromP, fly.toP, k);
      if (fly.t >= fly.dur) fly = null;
      dirty = true;
    }
    const moved = controls.update();
    if (updateModelLOD()) dirty = true;
    if (dirty || moved) {
      try {
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
      } catch (e) {
        state.dead = true;
        fail('算圖失敗', '原因：' + (e && e.message ? e.message : String(e)) + '\n可按下方按鈕重新載入。');
        return;
      }
      if (shaderError) {
        state.dead = true;
        fail('著色器編譯失敗', shaderError + '\n請回報此訊息，或按下方按鈕重新載入。');
        return;
      }
      dirty = false;
    }
  }

  loadmsg('算圖第一幀…');
  updateModelLOD();
  try {
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  } catch (e) {
    throw new Error('第一幀渲染失敗：' + (e && e.message ? e.message : String(e)));
  }
  if (shaderError) {
    fail('著色器編譯失敗', shaderError + '\n請回報此訊息，或按下方按鈕重新載入。');
    return;
  }
  window.__booted = true;
  $('#loading').style.display = 'none';
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
