<script type="module">
const $ = (s) => document.querySelector(s);
const loadmsg = (t) => { $('#loadmsg').textContent = t; };
function fail(title, msg) {
  $('#loading').style.display = 'none';
  $('#errtitle').textContent = title;
  $('#errmsg').textContent = msg;
  $('#errbox').classList.add('show');
}
$('#reloadbtn').addEventListener('click', () => location.reload());
window.addEventListener('error', (e) => {
  if ($('#errbox').classList.contains('show')) return;
  fail(window.__booted ? '執行期錯誤' : '載入發生問題', String((e && e.message) || e) + '\n可按下方按鈕重新載入。');
});
window.addEventListener('unhandledrejection', (e) => {
  if ($('#errbox').classList.contains('show')) return;
  const r = e && e.reason;
  fail('載入發生問題', String((r && r.message) || r || '未處理的非同步錯誤') + '\n可按下方按鈕重新載入。');
});

/* ---------- 固定種子亂數 ---------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- 項目正規化（引擎只讀 items[]；parkDetail 只當來源留底） ---------- */
function normalizeItems(d) {
  const POWER_NAMES = ['', '輕量放電', '中度放電', '重度放電'];
  const TAG_KEYS = [['沙坑', '玩沙'], ['戲水', '玩水'], ['玩水', '玩水'], ['水道', '玩水'], ['噴泉', '玩水'], ['溜索', '溜索'], ['滑索', '溜索'], ['鞦韆', '鞦韆'], ['攀爬', '攀爬'], ['攀岩', '攀爬'], ['跑酷', '攀爬'], ['野餐', '野餐'], ['草原', '野餐'], ['草坪', '野餐'], ['遮蔭', '遮蔭'], ['森林', '遮蔭'], ['無障礙', '無障礙'], ['廁所', '廁所'], ['公廁', '廁所'], ['停車', '停車']];
  for (const it of d.items) {
    const s = d.parkDetail[it.name] || {};
    it.summary = s.kid || it.summary;
    it.facts = (s.toys || '').split('、').filter((x) => x).slice(0, 3);
    it.metrics = [];
    const si = d.islands.find((x) => x.id === it.islandId);
    if (s.power) it.metrics.push({ label: '放電', value: '⚡'.repeat(s.power), note: POWER_NAMES[s.power], kind: 'actual', scope: si ? si.name : '', sourceIds: ['parks-appjs'] });
    if (s.toys) it.metrics.push({ label: '遊具', value: String(s.toys.split('、').filter((x) => x).length), unit: '種', kind: 'actual', scope: si ? si.name : '', sourceIds: ['parks-appjs'] });
    it.tags = [];
    const hay = (s.toys || '') + ' ' + (s.tip || '');
    for (const pair of TAG_KEYS) { if (hay.indexOf(pair[0]) !== -1 && it.tags.indexOf(pair[1]) === -1) it.tags.push(pair[1]); }
    it.age = s.age || ''; it.tip = s.tip || ''; it.addr = s.addr || '';
    it.nav = s.nav || ''; it.info = s.info || ''; it.power = s.power || 0;
  }
  d.flows = (d.flows || []).concat((d.ferries || []).map((f) => ({
    id: f.id, fromIslandId: f.from, toIslandId: f.to, fromItemId: null, toItemId: null,
    name: f.name, description: f.note || '', type: '順遊', direction: 'both',
    payload: f.payload || '親子出遊', payloadKind: f.payloadKind || 'basket',
    actor: f.actor || '家長與小朋友', evidence: f.evidence || 'pending',
    contentMode: d.meta.mode, sourceIds: d.sources.map((s) => s.id)
  })));
}

/* ---------- DATA 驗證 ---------- */
function validateDATA(d) {
  if (!d || !d.meta || !d.labels || !d.config || !d.environment) throw new Error('DATA 缺少 meta／labels／config／environment');
  if (!Array.isArray(d.islands) || !Array.isArray(d.items) || !Array.isArray(d.flows) || !Array.isArray(d.sources)) {
    throw new Error('DATA 的 islands／items／flows／sources 必須是陣列');
  }
  if (d.meta.mode === 'provided' && !d.sources.length) throw new Error('provided 模式必須提供來源');

  const ids = new Set(), names = new Set(), cells = new Set();
  const colors = /^#[0-9a-f]{6}$/i;
  const groundKinds = new Set(['brick', 'spots', 'stripes']);
  for (const isl of d.islands) {
    for (const f of ['id', 'name', 'en', 'summary', 'summaryEn', 'icon', 'treeType', 'itemIds', 'color', 'groundPattern']) {
      if (!isl[f]) throw new Error('島嶼缺少欄位 ' + f + '：' + (isl.name || isl.id || '未知'));
    }
    if (!Array.isArray(isl.itemIds)) throw new Error('島嶼 itemIds 必須是陣列：' + isl.name);
    if (!isl.summary || !isl.summaryEn) throw new Error('島嶼缺少中英文摘要：' + isl.name);
    for (const id of isl.itemIds) {
      if (!d.items.some((it) => it.id === id)) throw new Error('島嶼 itemIds 無對應項目：' + isl.name + '／' + id);
    }
    if (!Number.isInteger(isl.q) || !Number.isInteger(isl.r)) throw new Error('島嶼座標必須是整數：' + isl.name);
    if (!colors.test(isl.color)) throw new Error('島嶼顏色格式錯誤：' + isl.name);
    if (!groundKinds.has(isl.groundPattern)) throw new Error('島嶼地面圖樣無效：' + isl.name);
    if (ids.has(isl.id)) throw new Error('島嶼 id 重複：' + isl.id);
    if (names.has(isl.name)) throw new Error('島嶼名稱重複：' + isl.name);
    const k = isl.q + ',' + isl.r;
    if (cells.has(k)) throw new Error('島嶼座標重複：' + isl.name);
    ids.add(isl.id); names.add(isl.name); cells.add(k);
  }

  const itemIds = new Set(), itemNames = new Set();
  const sourceIds = new Set(d.sources.map((src) => src.id));
  for (const it of d.items) {
    for (const f of ['id', 'islandId', 'name', 'summary', 'model', 'contentMode']) {
      if (!it[f]) throw new Error('項目缺少欄位 ' + f + '：' + (it.id || it.name || '未知'));
    }
    if (itemIds.has(it.id)) throw new Error('項目 id 重複：' + it.id);
    if (itemNames.has(it.name)) throw new Error('項目名稱重複：' + it.name);
    if (!MODEL_NAMES.has(it.model)) throw new Error('項目模型未註冊：' + it.id + '／' + it.model);
    if (!Array.isArray(it.facts)) throw new Error('項目 facts 必須是陣列：' + it.id);
    if (!Array.isArray(it.sourceIds) || !it.sourceIds.length) throw new Error('項目缺少來源：' + it.id);
    for (const sid of it.sourceIds) if (!sourceIds.has(sid)) throw new Error('項目來源不存在：' + it.id + '／' + sid);
    const isl = d.islands.find((i) => i.id === it.islandId);
    if (!isl) throw new Error('項目所屬島嶼不存在：' + it.id);
    if (!isl.itemIds.includes(it.id)) throw new Error('島嶼 itemIds 未列出項目：' + isl.id + '／' + it.id);
    itemIds.add(it.id); itemNames.add(it.name);
  }
  for (const isl of d.islands) {
    if (isl.heroItemId && !isl.itemIds.includes(isl.heroItemId)) throw new Error('主要模型不屬於島嶼：' + isl.id);
    const actual = d.items.filter((it) => it.islandId === isl.id).map((it) => it.id);
    if (actual.length !== isl.itemIds.length || actual.some((id) => !isl.itemIds.includes(id))) {
      throw new Error('島嶼 itemIds 與項目 islandId 不一致：' + isl.id);
    }
  }
  if (!d.items.length) throw new Error('至少需要一個項目模型');

  const parkNames = new Set();
  for (const [c, p] of Object.entries(d.parks)) {
    if (!d.islands.some((i) => i.name === c)) throw new Error('景點縣市無對應島嶼：' + c);
    if (!Number.isInteger(p.count) || p.count < 1) throw new Error(c + ' 景點筆數無效');
    if (p.count !== p.names.length) throw new Error(c + ' 筆數與名單不一致');
    for (const n of p.names) {
      if (!n || parkNames.has(n)) throw new Error('景點名稱空白或重複：' + c + '／' + n);
      parkNames.add(n);
    }
  }
  const total = Object.values(d.parks).reduce((n, p) => n + p.count, 0);
  if (!(total > 0)) throw new Error('景點總數無效');
  if (d.islands.length < 1) throw new Error('島嶼數量無效');
  const todo = d.islands.filter((i) => !d.parks[i.name]).length;
  if (todo !== d.islands.length - Object.keys(d.parks).length) throw new Error('待補島嶼計算不一致，實際待補 ' + todo);
  for (const p of Object.values(d.parks)) {
    for (const n of p.names) {
      const dd = d.parkDetail[n];
      if (!dd) throw new Error('景點缺少詳情：' + n);
      if (![1, 2, 3].includes(dd.power)) throw new Error('景點放電度無效：' + n);
      if (!dd.nav || !dd.info) throw new Error('景點缺少連結：' + n);
    }
  }
  for (const it of d.items) {
    if (!it.id || !it.islandId || !it.name || !it.model) throw new Error('項目缺少基本欄位');
    if (!d.islands.some((i) => i.id === it.islandId)) throw new Error('項目無對應島嶼：' + it.id);
    if (!Array.isArray(it.facts) || !it.facts.length) throw new Error('項目缺少重點：' + it.id);
    if (!Array.isArray(it.metrics)) throw new Error('項目缺少數字磚：' + it.id);
    for (const m of it.metrics) { if (!m.label || m.value == null || !m.kind) throw new Error('數字磚缺少欄位：' + it.id); }
  }
  for (const f of d.ferries || []) {
    if (['documented', 'thematic', 'pending'].indexOf(f.evidence) === -1) throw new Error('關係證據等級無效：' + f.id);
  }
  if (!Array.isArray(d.flows) || !d.flows.length) throw new Error('缺少跨島關係 flows');
  for (const f of d.flows) {
    if (!d.islands.some((i) => i.id === f.fromIslandId) || !d.islands.some((i) => i.id === f.toIslandId)) throw new Error('關係端點無對應島嶼：' + f.id);
  }
  if (d.story && d.story.mode === 'clock') {
    for (const s of d.story.stages || []) {
      for (const id of s.activeIslandIds || []) if (!d.islands.some((i) => i.id === id)) throw new Error('導覽階段無對應島嶼：' + s.id);
      for (const id of s.activeItemIds || []) if (!d.items.some((i) => i.id === id)) throw new Error('導覽階段無對應項目：' + s.id);
      if (!Array.isArray(s.activeFlowIds)) throw new Error('導覽階段缺少 activeFlowIds：' + s.id);
    }
  }
  // 路網連通性：橋樑相鄰＋船線，全部島嶼須連通
  {
    const idOf = new Map(d.islands.map((i) => [i.id, i]));
    const cell = new Map(d.islands.map((i) => [i.q + ',' + i.r, i.id]));
    const adj = new Map(d.islands.map((i) => [i.id, new Set()]));
    const D6 = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
    for (const isl of d.islands) for (const [dq, dr] of D6) {
      const nb = cell.get((isl.q + dq) + ',' + (isl.r + dr));
      if (nb) { adj.get(isl.id).add(nb); adj.get(nb).add(isl.id); }
    }
    for (const f of d.ferries || []) {
      if (!idOf.has(f.from) || !idOf.has(f.to)) throw new Error('船線端點無對應島嶼：' + f.id);
      adj.get(f.from).add(f.to); adj.get(f.to).add(f.from);
    }
    const seen = new Set([d.islands[0].id]);
    const queue = [d.islands[0].id];
    while (queue.length) { const cur = queue.pop(); for (const nb of adj.get(cur)) if (!seen.has(nb)) { seen.add(nb); queue.push(nb); } }
    if (seen.size !== d.islands.length) throw new Error('群島未完全連通（橋＋船），僅連通 ' + seen.size + '／' + d.islands.length);
  }

  if (!Number.isFinite(d.environment.startMinutes) || !Number.isFinite(d.environment.minutesPerSecond)) {
    throw new Error('environment 缺少初始時間或時間速度');
  }
  const kf = d.environment.keyframes;
  if (!kf.length || kf[0].m !== 0 || kf[kf.length - 1].m !== 1440) throw new Error('日夜 keyframes 不完整');
  let prevM = -1;
  for (const k of kf) {
    if (!Number.isFinite(k.m) || k.m <= prevM) throw new Error('日夜 keyframes 分鐘需遞增');
    prevM = k.m;
    for (const f of ['top', 'hor', 'sun', 'hs', 'hg', 'water']) {
      if (!colors.test(k[f])) throw new Error('日夜 keyframe 顏色格式錯誤：' + k.m + '／' + f);
    }
    for (const f of ['sunI', 'hemiI', 'night']) {
      if (!Number.isFinite(k[f])) throw new Error('日夜 keyframe 數值錯誤：' + k.m + '／' + f);
    }
  }
  const cam = d.config.camera;
  for (const f of ['fov', 'near', 'far', 'minDistance', 'maxDistance']) {
    if (!Number.isFinite(cam[f])) throw new Error('相機設定缺少 ' + f);
  }
  if (!Array.isArray(cam.panoramaDir) || cam.panoramaDir.length !== 3) throw new Error('相機全景方向無效');
}

/* ================= 啟動 ================= */
boot().catch((err) => {
  console.error(err);
  fail('載入失敗', '原因：' + (err && err.message ? err.message : String(err)) + '\n請確認網路連線（需載入 Three.js CDN）與瀏覽器 WebGL 支援，或按下方按鈕重新載入。');
});

async function boot() {
  loadmsg('檢查資料…');
  normalizeItems(DATA);
  validateDATA(DATA);

  loadmsg('載入 Three.js（CDN）…');
  let THREE, OrbitControls, CSS2DRenderer, CSS2DObject, RoundedBoxGeometry, BufferGeometryUtils, SimplexNoise;
  try {
    THREE = await import('three');
    ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
    ({ CSS2DRenderer, CSS2DObject } = await import('three/addons/renderers/CSS2DRenderer.js'));
    ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
    BufferGeometryUtils = await import('three/addons/utils/BufferGeometryUtils.js');
    ({ SimplexNoise } = await import('three/addons/math/SimplexNoise.js'));
  } catch (e) {
    throw new Error('Three.js CDN 載入失敗（需要網路連線）。' + (e && e.message ? ' ' + e.message : ''));
  }

  const state = {
    envMinutes: DATA.environment.startMinutes,
    selectedIsland: null,
    userInteracted: false, dead: false,
    net: null, islandMeshes: new Map(), labelObjs: new Map(), itemPos: new Map(),
    selectedFlowId: null, selectedWalkerId: null, simTime: 0
  };
  let dirty = true;
  // localStorage：讀寫都 try/catch，不可阻止展示
  try {
    const saved = JSON.parse(localStorage.getItem('island3d') || '{}');
    if (typeof saved.envMinutes === 'number') state.envMinutes = Math.min(1439, Math.max(0, saved.envMinutes));
  } catch (e) { /* 忽略 */ }
  const persist = () => {
    try { localStorage.setItem('island3d', JSON.stringify({ envMinutes: Math.round(state.envMinutes) })); }
    catch (e) { /* 忽略 */ }
  };

  const { R, SPACING, TOP, WATER_Y } = DATA.config;
  const SQRT3 = Math.sqrt(3);
  const axialToWorld = (q, r) => ({ x: SQRT3 * SPACING * (q + r / 2), z: 1.5 * SPACING * r });

  /* ---------- Renderer / Scene / Camera ---------- */
  loadmsg('建立渲染器…');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) {
    throw new Error('此裝置或瀏覽器不支援 WebGL，無法顯示 3D 場景。請改用支援 WebGL 的 Chrome / Edge / Safari 再試一次。');
  }
  if (!renderer.getContext()) throw new Error('無法建立 WebGL 繪圖環境（WebGL context 建立失敗）。');
  const isMobile = Math.min(innerWidth, innerHeight) < 800 || /Mobi|Android/i.test(navigator.userAgent);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.4 : 1.75));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  let shaderError = null;
  renderer.debug.checkShaderErrors = true;
  renderer.debug.onShaderError = (gl, program, glVertexShader, glFragmentShader) => {
    const vs = gl.getShaderInfoLog(glVertexShader) || '';
    const fs = gl.getShaderInfoLog(glFragmentShader) || '';
    const link = gl.getProgramInfoLog(program) || '';
    shaderError = (link + '\n' + vs + '\n' + fs).trim().slice(-700);
    console.error('Shader compile/link error', shaderError);
  };
  $('#scene').appendChild(renderer.domElement);

  const labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(innerWidth, innerHeight);
  $('#labels').appendChild(labelRenderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf4eee3, 42, 150);

  const camera = new THREE.PerspectiveCamera(DATA.config.camera.fov, innerWidth / innerHeight, DATA.config.camera.near, DATA.config.camera.far);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minPolarAngle = THREE.MathUtils.degToRad(25);
  controls.maxPolarAngle = THREE.MathUtils.degToRad(70);
  controls.minDistance = DATA.config.camera.minDistance;
  controls.maxDistance = DATA.config.camera.maxDistance;
  controls.addEventListener('start', () => { state.userInteracted = true; });

  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    state.dead = true;
    fail('顯示中斷', 'WebGL 繪圖環境遺失（顯示卡重置或資源不足）。\n請按下方按鈕重新載入。');
  });

  /* ---------- 燈光 ---------- */
  const hemi = new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 1.3);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1de, 2.8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
  sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 90;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.045; sun.shadow.radius = 3;
  scene.add(sun); scene.add(sun.target);
  const fill = new THREE.DirectionalLight(0xbfd6ff, 0.35);
  fill.position.set(-18, 12, -20);
  scene.add(fill);

  /* ---------- 天空 ---------- */
  const skyUni = {
    uTop: { value: new THREE.Color('#9fd0ec') },
    uHorizon: { value: new THREE.Color('#f4eee3') },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) },
    uSun: { value: new THREE.Color('#fff1de') },
    uNight: { value: 0 }
  };
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(170, 32, 20),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: skyUni,
      vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: [
        'varying vec3 vDir; uniform vec3 uTop,uHorizon,uSun; uniform vec3 uSunDir; uniform float uNight;',
        'float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453); }',
        'void main(){',
        '  vec3 dir = normalize(vDir);',
        '  vec3 col = mix(uHorizon, uTop, smoothstep(-0.02, 0.55, dir.y));',
        '  col += uSun * pow(max(dot(dir, uSunDir), 0.0), 18.0) * 0.35;',
        '  vec3 cell = floor(dir * 180.0);',
        '  float star = step(0.9965, hash(cell)) * uNight * smoothstep(-0.12, 0.25, dir.y);',
        '  col += vec3(star) * 0.85;',
        '  gl_FragColor = vec4(col, 1.0);',
        '  #include <tonemapping_fragment>',
        '  #include <colorspace_fragment>',
        '}'
      ].join('\n')
    })
  );
  scene.add(sky);

  /* ---------- 水面 ---------- */
  const waterUni = THREE.UniformsUtils.merge([
    THREE.UniformsLib.fog,
    { uShallow: { value: new THREE.Color('#a4d4da') }, uDeep: { value: new THREE.Color('#6fa9b8') }, uTint: { value: new THREE.Color('#a9d8db') }, uTime: { value: 0 }, uNight: { value: 0 } }
  ]);
  const water = new THREE.Mesh(
    new THREE.CircleGeometry(160, 64).rotateX(-Math.PI / 2),
    new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: true, uniforms: waterUni,
      vertexShader: [
        'varying vec3 vW; varying float vFogDepth;',
        'void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vW = wp.xyz;',
        '  vec4 mv = viewMatrix * wp; vFogDepth = -mv.z;',
        '  gl_Position = projectionMatrix * mv; }'
      ].join('\n'),
      fragmentShader: [
        'varying vec3 vW; uniform vec3 uShallow,uDeep,uTint; uniform float uTime, uNight;',
        'uniform vec3 fogColor; uniform float fogNear, fogFar; varying float vFogDepth;',
        'void main(){',
        '  float w1 = sin(vW.x * 0.16 + uTime * 0.6) * sin(vW.z * 0.13 - uTime * 0.4);',
        '  float w2 = sin((vW.x + vW.z) * 0.07 + uTime * 0.25);',
        '  vec3 col = mix(uShallow, uDeep, clamp(0.5 + 0.28 * w1 + 0.22 * w2, 0.0, 1.0));',
        '  col = mix(col, uTint, 0.78);',
        '  float dc = length(vW.xz) / 60.0;',
        '  col = mix(col, uTint * 0.72, clamp(dc, 0.0, 1.0) * 0.55);',
        '  float sp = pow(max(0.0, sin(vW.x * 1.7 + uTime * 1.1) * sin(vW.z * 1.53 - uTime * 0.9)), 30.0);',
        '  col += vec3(1.0, 0.98, 0.94) * sp * (0.14 * (1.0 - 0.8 * uNight));',
        '  float fogF = smoothstep(fogNear, fogFar, vFogDepth);',
        '  col = mix(col, fogColor, fogF);',
        '  gl_FragColor = vec4(col, 1.0);',
        '  #include <tonemapping_fragment>',
        '  #include <colorspace_fragment>',
        '}'
      ].join('\n')
    })
  );
  water.position.y = WATER_Y; water.renderOrder = 0;
  scene.add(water);

  /* ---------- 地面貼圖（canvas 程序產生：磚紋／斑點／條紋） ---------- */
  function groundTexture(kind) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#f2e7d5'; g.fillRect(0, 0, 256, 256);
    if (kind === 'brick') {
      g.strokeStyle = '#d9c6a8'; g.lineWidth = 3;
      for (let y = 0; y <= 256; y += 32) {
        g.beginPath(); g.moveTo(0, y); g.lineTo(256, y); g.stroke();
        const off = (y / 32) % 2 ? 32 : 0;
        for (let x = off; x <= 256; x += 64) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 32); g.stroke(); }
      }
    } else if (kind === 'spots') {
      const r2 = mulberry32(DATA.meta.seed);
      for (let i = 0; i < 90; i++) {
        g.fillStyle = ['#e3cfae', '#dcc19c', '#efe0c6'][i % 3];
        g.beginPath(); g.arc(r2() * 256, r2() * 256, 4 + r2() * 9, 0, 7); g.fill();
      }
    } else {
      g.strokeStyle = '#ddc9a6'; g.lineWidth = 10;
      for (let x = -256; x < 512; x += 28) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 128, 256); g.stroke(); }
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }
  const groundTex = { brick: groundTexture('brick'), spots: groundTexture('spots'), stripes: groundTexture('stripes') };

  /* ---------- 六角島 ---------- */
  loadmsg('組合六角群島…');
  const world = new THREE.Group(); scene.add(world);
  const islandGroup = new THREE.Group(); world.add(islandGroup);
  const hexTopGeoBase = () => new THREE.CircleGeometry(R - 0.05, 6).rotateZ(Math.PI / 6).rotateX(-Math.PI / 2);
  const hexRing = (inner, outer) => new THREE.RingGeometry(inner, outer, 6, 1).rotateZ(Math.PI / 6).rotateX(-Math.PI / 2);
  const CORAL = new THREE.Color(DATA.config.brand);
  // 共用幾何與材質（島面 UV 逐島不同故不共用；其餘 22 島共用，減少 draw 前配置）
  const WALL_H = TOP - (WATER_Y - 0.5);
  const WALL_GEO = new THREE.CylinderGeometry(R - 0.02, (R - 0.02) * 0.9, WALL_H, 6, 1, true);
  const WALL_BASE = new THREE.Color('#c9b18c');
  const WALL_MAT = new THREE.MeshStandardMaterial({ color: '#c9b18c', roughness: 0.95 });
  const BAND_GEO = new THREE.CylinderGeometry(R + 0.005, R + 0.005, 0.16, 6, 1, true);
  const CURB_GEO = hexRing(1.8 - 0.17, 1.8 + 0.17);
  const PATH_GEO = hexRing(1.8 - 0.14, 1.8 + 0.14);

  const centers = DATA.islands.map((i) => axialToWorld(i.q, i.r));

  const shallowMats = [], foamMats = [], labelAnchors = [];

    label.position.set(0, labelY, labelZ);

    labelAnchors.push(new THREE.Vector3(x, labelY, z + labelZ));

    islandGroup.add(g);
  }

  /* ---------- 島體基底實例化（6 draws 取代 132 個 Mesh） ---------- */
  {
    const G = { wall: WALL_GEO, band: BAND_GEO, curb: CURB_GEO, path: PATH_GEO, shallow: SHALLOW_GEO, foam: FOAM_GEO };
    const M = { wall: WALL_MAT, band: new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.8 }), curb: CURB_MAT, path: PATH_MAT, shallow: SHALLOW_MAT, foam: FOAM_MAT };
    const m4 = new THREE.Matrix4(), col = new THREE.Color();
    for (const key of Object.keys(G)) {
      const list = baseParts.filter((p) => p.geo === key);
      const im = new THREE.InstancedMesh(G[key], M[key], list.length);
      list.forEach((p, i) => {
        m4.makeTranslation(p.x, p.y, p.z);
        im.setMatrixAt(i, m4);
        im.setColorAt(i, p.color ? col.set(p.color) : col.set('#ffffff'));
      });
      im.instanceMatrix.needsUpdate = true;
      if (im.instanceColor) im.instanceColor.needsUpdate = true;
      im.userData.baseParts = list;
      if (key === 'curb' || key === 'path') im.receiveShadow = true;
      if (key === 'shallow') im.renderOrder = 1;
      if (key === 'foam') im.renderOrder = 2;
      world.add(im);
      (state.baseMeshes = state.baseMeshes || []).push(im);
    }
  }

  /* ---------- 橋（相鄰島嶼，9 片甲板＋小拱） ---------- */
  const cellOf = new Map(DATA.islands.map((i) => [i.q + ',' + i.r, i]));
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  const pairs = [];
  for (const isl of DATA.islands) {
    for (const [dq, dr] of DIRS) {
      const nb = cellOf.get((isl.q + dq) + ',' + (isl.r + dr));
      if (nb && isl.id < nb.id) pairs.push([isl, nb]);
    }
  }
  // 面向鄰島的邊中點方向（pointy-top 六角：邊法線朝 0/60/…/300 度）
  function edgePoint(center, toward) {
    let best = null, bd = -2;
    for (let k = 0; k < 6; k++) {
      const a = (k * Math.PI) / 3;
      const dx = Math.cos(a), dz = Math.sin(a);
      const d = dx * toward.x + dz * toward.z;
      if (d > bd) { bd = d; best = { x: dx, z: dz }; }
    }
    return best;
  }
  const deckMatrices = [], beamMatrices = [];
  const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler(), tmpS = new THREE.Vector3();
  for (const [a, b] of pairs) {
    const ca = axialToWorld(a.q, a.r), cb = axialToWorld(b.q, b.r);
    const dir = { x: cb.x - ca.x, z: cb.z - ca.z };
    const len = Math.hypot(dir.x, dir.z); dir.x /= len; dir.z /= len;
    const ea = edgePoint(ca, dir), eb = edgePoint(cb, { x: -dir.x, z: -dir.z });
    const pa = { x: ca.x + ea.x * 1.559, z: ca.z + ea.z * 1.559 };
    const pb = { x: cb.x + eb.x * 1.559, z: cb.z + eb.z * 1.559 };
    const span = Math.hypot(pb.x - pa.x, pb.z - pa.z);
    const ang = Math.atan2(pb.x - pa.x, pb.z - pa.z);
    for (let i = 0; i < 9; i++) {
      const t = (i + 0.5) / 9;
      const arch = Math.sin(t * Math.PI) * 0.05;
      tmpE.set(0, ang, 0); tmpQ.setFromEuler(tmpE); tmpS.set(1, 1, 1);
      tmpM.compose(new THREE.Vector3(pa.x + (pb.x - pa.x) * t, TOP + 0.03 + arch, pa.z + (pb.z - pa.z) * t), tmpQ, tmpS);
      deckMatrices.push(tmpM.clone());
    }
    for (const side of [-0.3, 0.3]) {
      const mx = (pa.x + pb.x) / 2 - dir.z * side, mz = (pa.z + pb.z) / 2 + dir.x * side;
      tmpE.set(0, ang, 0); tmpQ.setFromEuler(tmpE); tmpS.set(1, 1, 1);
      tmpM.compose(new THREE.Vector3(mx, TOP + 0.12, mz), tmpQ, tmpS);
      beamMatrices.push({ m: tmpM.clone(), len: span });
    }
  }
  // 跨海船線改由階段 4 的管狀關係線建立（見 buildRoadNet 後）
  {
    const deckGeo = new THREE.BoxGeometry(0.56, 0.07, 0.16);
    const decks = new THREE.InstancedMesh(deckGeo, new THREE.MeshStandardMaterial({ color: '#c98d5f', roughness: 0.85 }), deckMatrices.length);
    deckMatrices.forEach((m, i) => decks.setMatrixAt(i, m));
    decks.castShadow = true; decks.receiveShadow = true; world.add(decks);
    const beamGeo = new THREE.BoxGeometry(0.07, 0.07, 1);
    const beams = new THREE.InstancedMesh(beamGeo, new THREE.MeshStandardMaterial({ color: '#a34e34', roughness: 0.85 }), beamMatrices.length);
    beamMatrices.forEach((o, i) => { const s = new THREE.Vector3(1, 1, o.len); const mm = o.m.clone().scale(s); beams.setMatrixAt(i, mm); });
    world.add(beams);
  }

  /* ---------- 路網（每島 12 節點＋橋連接＋Dijkstra） ---------- */
  function buildRoadNet() {
    const nodes = [], adj = new Map(), keyOf = new Map();
    const addNode = (x, y, z2, island) => {
      const idx = nodes.length;
      nodes.push({ x, y, z: z2, island }); adj.set(idx, []);
      return idx;
    };
    const link = (i, j) => {
      const w = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].z - nodes[j].z);
      adj.get(i).push({ to: j, w }); adj.get(j).push({ to: i, w });
    };
    for (const isl of DATA.islands) {
      const { x: cx, z: cz } = axialToWorld(isl.q, isl.r);
      const ring = [];
      for (let k = 0; k < 12; k++) {
        const a = (k * Math.PI) / 6; // 奇數＝步道頂點(1.8)，偶數＝邊中點(1.559)
        const rad = k % 2 === 1 ? 1.8 : 1.8 * Math.cos(Math.PI / 6);
        const idx = addNode(cx + Math.cos(a) * rad, TOP + 0.05, cz + Math.sin(a) * rad, isl.id);
        ring.push(idx);
        if (k % 2 === 0) {
          const ea = Math.round(a / (Math.PI / 3)) % 6;
          keyOf.set(isl.id + ':e' + ((ea % 6) + 6) % 6, idx);
        }
      }
      for (let k = 0; k < 12; k++) link(ring[k], ring[(k + 1) % 12]);
    }
    for (const [a, b] of pairs) {
      const ca = axialToWorld(a.q, a.r), cb = axialToWorld(b.q, b.r);
      const dir = { x: cb.x - ca.x, z: cb.z - ca.z };
      const L = Math.hypot(dir.x, dir.z); dir.x /= L; dir.z /= L;
      const ea = Math.round(Math.atan2(dir.z, dir.x) / (Math.PI / 3));
      const eb = Math.round(Math.atan2(-dir.z, -dir.x) / (Math.PI / 3));
      const na = keyOf.get(a.id + ':e' + ((ea % 6) + 6) % 6);
      const nb = keyOf.get(b.id + ':e' + ((eb % 6) + 6) % 6);
      if (na == null || nb == null) throw new Error('橋樑路網節點缺失：' + a.name + '↔' + b.name);
      const mx = (nodes[na].x + nodes[nb].x) / 2, mz = (nodes[na].z + nodes[nb].z) / 2;
      const mid = addNode(mx, TOP + 0.03 + 0.05 + 0.04, mz, a.id + '~' + b.id); // 橋拱頂行走高度，不穿橋
      link(na, mid); link(mid, nb);
    }
    for (const f of DATA.ferries || []) {
      const A = DATA.islands.find((i) => i.id === (f.fromIslandId || f.from)), B = DATA.islands.find((i) => i.id === (f.toIslandId || f.to));
      if (!A || !B) throw new Error('船線端點無對應島嶼：' + f.id);
      let ba = -1, bb = -1, bd = Infinity;
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].island !== A.id) continue;
        for (let j = 0; j < nodes.length; j++) {
          if (nodes[j].island !== B.id) continue;
          const dd = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].z - nodes[j].z);
          if (dd < bd) { bd = dd; ba = i; bb = j; }
        }
      }
      if (ba === -1) throw new Error('船線找不到靠岸節點：' + f.id);
      link(ba, bb);
    }
    return { nodes, adj };
  }
  state.net = buildRoadNet();
  function dijkstra(from, to) { // 階段 4 角色行走共用
    const dist = new Array(state.net.nodes.length).fill(Infinity);
    const prev = new Array(state.net.nodes.length).fill(-1);
    const done = new Set(); dist[from] = 0;
    for (;;) {
      let u = -1, best = Infinity;
      for (let i = 0; i < dist.length; i++) if (!done.has(i) && dist[i] < best) { best = dist[i]; u = i; }
      if (u === -1 || u === to) break;
      done.add(u);
      for (const { to: v, w } of state.net.adj.get(u)) {
        if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
      }
    }
    if (!isFinite(dist[to])) return null;
    const path = []; let c = to;
    while (c !== -1) { path.unshift(c); c = prev[c]; }
    return path;
  }

  /* ================= 階段 4：角色、搬運與關係線 ================= */
  const hashSeed = (str) => {
    let h = DATA.meta.seed >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0) || 1;
  };
  const WCFG = DATA.config.stage4;

  /* ---------- 路網折線曲線（不切角、不離路） ---------- */
  class PolyCurve extends THREE.Curve {
    constructor(points) {
      super();
      this.points = points;
      this.cum = [0];
      for (let i = 1; i < points.length; i++) {
        this.cum.push(this.cum[i - 1] + points[i].distanceTo(points[i - 1]));
      }
      this.total = this.cum[this.cum.length - 1] || 0;
    }
    getPoint(t, target) {
      const out = target || new THREE.Vector3();
      const d = THREE.MathUtils.clamp(t, 0, 1) * this.total;
      let i = 0;
      while (i < this.cum.length - 2 && this.cum[i + 1] < d) i++;
      const seg = this.cum[i + 1] - this.cum[i];
      const k = seg > 1e-9 ? (d - this.cum[i]) / seg : 0;
      return out.copy(this.points[i]).lerp(this.points[i + 1], k);
    }
    getPointAt(u, target) { return this.getPoint(u, target); }
    getLength() { return this.total; }
  }

  const flowRuntime = new Map();
  const flowRecs = [];
  const walkers = [];
  const walkerById = new Map();
  let showFlows = false, showNames = true, showPayload = true;

  function nearestFlowNodes(flow) {
    const A = DATA.islands.find((i) => i.id === (flow.fromIslandId || flow.from));
    const B = DATA.islands.find((i) => i.id === (flow.toIslandId || flow.to));
    if (!A || !B) return null;
    let ba = -1, bb = -1, best = Infinity;
    for (let i = 0; i < state.net.nodes.length; i++) {
      if (state.net.nodes[i].island !== A.id) continue;
      for (let j = 0; j < state.net.nodes.length; j++) {
        if (state.net.nodes[j].island !== B.id) continue;
        const dd = Math.hypot(state.net.nodes[i].x - state.net.nodes[j].x, state.net.nodes[i].z - state.net.nodes[j].z);
        if (dd < best) { best = dd; ba = i; bb = j; }
      }
    }
    return ba === -1 ? null : { from: ba, to: bb };
  }

  const FLOW_VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
  const FLOW_FRAG = [
    'uniform vec3 uColor;',
    'uniform float uTime;',
    'uniform float uLength;',
    'uniform float uPattern;',
    'uniform float uBoth;',
    'uniform float uDir;',
    'uniform float uOpacity;',
    'varying vec2 vUv;',
    'void main(){',
    '  float u = vUv.x * uLength * 5.0 - uTime * 1.4 * uDir;',
    '  float f = fract(u);',
    '  float duty = uPattern > 1.5 ? 0.3 : (uPattern > 0.5 ? 0.6 : 1.0);',
    '  bool keep = f <= duty;',
        '  if (uBoth > 0.5 && duty < 1.0) keep = keep || fract(vUv.x * uLength * 5.0 + uTime * 1.4) <= duty;',
    '  if (!keep) discard;',
    '  gl_FragColor = vec4(uColor, uOpacity);',
    '}'
  ].join('\n');

  const FERRY_EDGES = new Set();
  for (const f of DATA.flows.filter((x) => x.evidence === 'pending')) {
    const ends = nearestFlowNodes(f);
    if (ends) { FERRY_EDGES.add(ends.from + '>' + ends.to); FERRY_EDGES.add(ends.to + '>' + ends.from); }
  }
  function buildFlowRuntime() {
    for (const f of DATA.flows) {
      const ends = nearestFlowNodes(f);
      if (!ends) throw new Error('關係線找不到端點節點：' + f.id);
      const path = dijkstra(ends.from, ends.to);
      if (!path || !path.length) throw new Error('關係線無法尋路：' + f.id);
      if (f.evidence !== 'pending') {
        for (let k = 0; k + 1 < path.length; k++) {
          if (FERRY_EDGES.has(path[k] + '>' + path[k + 1])) throw new Error('陸上順遊誤走跨海邊：' + f.id);
        }
      }
      const pts = path.map((idx) => {
        const n = state.net.nodes[idx];
        return new THREE.Vector3(n.x, n.y, n.z);
      });
      const curve = new PolyCurve(pts);
      const rec = { flow: f, pts, curve, length: curve.getLength(), meshes: [], picks: [] };
      const seg = Math.max(24, Math.min(420, pts.length * 12));
      const pattern = f.evidence === 'pending' ? 2 : (f.evidence === 'thematic' ? 1 : 0);
      const geo = new THREE.TubeGeometry(curve, seg, 0.035, 6, false);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: CORAL.clone() },
          uTime: { value: 0 },
          uLength: { value: rec.length },
          uPattern: { value: pattern },
          uBoth: { value: f.direction === 'both' ? 1 : 0 },
          uDir: { value: f.direction === 'none' ? 0 : 1 },
          uOpacity: { value: 0.82 }
        },
        vertexShader: FLOW_VERT, fragmentShader: FLOW_FRAG,
        transparent: true, depthWrite: false, side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = 4;
      mesh.visible = false;
      mesh.userData.flowId = f.id;
      world.add(mesh);
      rec.meshes.push(mesh);

      const pick = new THREE.Mesh(
        new THREE.TubeGeometry(curve, seg, 0.12, 4, false),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      pick.userData.flowPick = f.id;
      pick.visible = false;
      world.add(pick);
      rec.picks.push(pick);
      flowRecs.push(rec);
      flowRuntime.set(f.id, rec);
    }
  }
  buildFlowRuntime();
  state.flowPickMeshes = flowRecs.flatMap((r) => r.picks);

  /* ---------- chibi 角色零件（共用 InstancedMesh） ---------- */
  function islandLoopRec(islId) {
    const idx = [];
    state.net.nodes.forEach((n, i) => { if (n.island === islId) idx.push(i); });
    if (idx.length < 3) return null;
    const isl = DATA.islands.find((i) => i.id === islId);
    const c = axialToWorld(isl.q, isl.r);
    const ang = (i) => Math.atan2(state.net.nodes[i].z - c.z, state.net.nodes[i].x - c.x);
    idx.sort((a, b) => ang(a) - ang(b));
    const pts = idx.map((i) => { const n = state.net.nodes[i]; return new THREE.Vector3(n.x, n.y, n.z); });
    pts.push(pts[0].clone());
    const curve = new PolyCurve(pts);
    return { flow: null, pts, curve, length: curve.getLength(), islandId: islId, loop: true };
  }
  function buildWalkers() {
    const names = WCFG.names;
    let ni = 0;
    const mk = (o) => {
      const rng = mulberry32(hashSeed('stage4:' + o.id));
      const actor = o.actor;
      const w = Object.assign({
        speed: WCFG.walkSpeedMin + rng() * Math.max(0.01, WCFG.walkSpeedMax - WCFG.walkSpeedMin),
        d: 0, dir: 1, pause: 0, pauseEnd: null, anim: 0, phase: rng(),
        shirt: new THREE.Color(actor === 'student' ? '#1F8A5B' : '#E85A24').offsetHSL((rng() - 0.5) * 0.045, 0, (rng() - 0.5) * 0.08),
        pants: new THREE.Color(rng() > 0.5 ? '#3d4a5a' : '#6b5f52'),
        view: null
      }, o);
      walkers.push(w); walkerById.set(w.id, w);
    };
    const landFlows = DATA.flows.filter((f) => f.evidence !== 'pending');
    for (const f of landFlows) {
      const rec = flowRuntime.get(f.id);
      if (!rec || !rec.length) continue;
      for (let k = 0; k < 2; k++) {
        const actor = WCFG.actorKinds[ni % WCFG.actorKinds.length];
        mk({ id: 'w-' + f.id + '-' + k, name: names[ni++ % names.length], actor,
          actorLabel: actor === 'student' ? '學童' : '家長',

  function sampleFlow(rec, d, outP, outT) {
    const pts = rec.pts, cum = rec.curve.cum;
    d = THREE.MathUtils.clamp(d, 0, rec.length);
    let i = 0;
    while (i < cum.length - 2 && cum[i + 1] < d) i++;
    const seg = cum[i + 1] - cum[i];
    const k = seg > 1e-9 ? (d - cum[i]) / seg : 0;
    outP.copy(pts[i]).lerp(pts[i + 1], k);
    outT.copy(pts[i + 1]).sub(pts[i]);
    if (outT.lengthSq() < 1e-9) outT.set(0, 0, 1); else outT.normalize();
  }

  function walkerDest(w) {
    if (w.kind === 'loop') return w.islandId;

    _wM.multiplyMatrices(_wRoot, _wLocal);
    part.im.setMatrixAt(wi * part.per + sub, _wM);
  }

  function updateWalkers(dt, advance) {
    if (!walkers.length) return;

      const w = walkers[wi];

      const L = rec.length;

      if (advance) {
        if (w.kind === 'loop') {
          w.d += w.speed * dt;
          if (w.d >= L) {
            w.d -= L;

          }

        } else if (w.pause > 0) {

            log('交接：' + w.name + '（' + w.actorLabel + '）在 ' + here + ' 交付' + w.payload, w.flowId, true);
            if (f.direction === 'both') {
              w.dir = atTo ? -1 : 1;
            } else {
              w.d = 0; w.dir = 1;
            }
            w.pause = 0; w.pauseEnd = null;
            const origin = (f.direction === 'both') ? here : islandName(f.fromIslandId);
            const dest = islandName(w.dir >= 0 ? f.toIslandId : f.fromIslandId);
            log('出發：' + w.name + '（' + w.actorLabel + '）從 ' + origin + ' 前往 ' + dest + '，搬運' + w.payload, w.flowId, true);
          }
        }
        else if (w.kind !== 'loop') {
          const before = w.d;
          w.d += w.speed * dt * w.dir;
          if (w.d >= L) {
            w.d = L; w.pause = WCFG.pauseSeconds; w.pauseEnd = 'to';
            log('抵達：' + w.name + ' 抵達 ' + islandName(f.toIslandId) + '（' + w.payload + '）', w.flowId, true);
          } else if (w.d <= 0) {
            w.d = 0; w.pause = WCFG.pauseSeconds; w.pauseEnd = 'from';
            log('抵達：' + w.name + ' 抵達 ' + islandName(f.fromIslandId) + '（' + w.payload + '）', w.flowId, true);

      const camDist = camera.position.distanceTo(_wPos);

      const yaw = Math.atan2(_wTan.x * w.dir, _wTan.z * w.dir);

      setPartMatrix('eye', wi, 1, 0.024, 0.287, 0.063, _lq, 1, 1, 1);

  function kitBegin(originX, originZ, baseY, scale, yaw, itemId, islandId, rng, accent) {
    kitCtx = { x: originX, z: originZ, baseY, scale, yaw, itemId, islandId, rng,
      accent: accent instanceof THREE.Color ? accent : new THREE.Color(accent || DATA.config.brand) };
  }
  function part(kind, lx, ly, lz, sx, sy, sz, color, opt) {
    const ctx = kitCtx;
    const o = opt || {};
    const ca = Math.cos(ctx.yaw), sa = Math.sin(ctx.yaw);
    const wx = ctx.x + (lx * ca + lz * sa) * ctx.scale;
    const wz = ctx.z + (-lx * sa + lz * ca) * ctx.scale;
    const wy = ctx.baseY + ly * ctx.scale;
    _ke.set(o.rx || 0, ctx.yaw + (o.ry || 0), o.rz || 0, 'YXZ');
    _kq.setFromEuler(_ke);
    const jz = 1 + (ctx.rng() - 0.5) * 0.0144;
    _ks.set(sx * ctx.scale * jz, sy * ctx.scale * jz, sz * ctx.scale * jz);
    _km.compose(_kv.set(wx, wy, wz), _kq, _ks);
    const glow = o.glow === true || kind === 'glowbox' || kind === 'glowsphere';
    kitParts.push({
      kind, matrix: _km.clone(),
      color: color instanceof THREE.Color ? color.clone() : new THREE.Color(color),
      materialClass: glow ? 'glow' : 'solid',
      detailLevel: Number.isFinite(o.detail) ? o.detail : 0,
      itemId: ctx.itemId || null, islandId: ctx.islandId || null

          part('sphere', cx + (i - 1) * 0.055, 0.44, 0.04 + (i % 2) * 0.04, 0.07, 0.07, 0.07, [PAL.coral, PAL.yellow, PAL.leaf1][ci]);
        }
      }
      part('glowbox', 0, 0.64, 0.22, 0.28, 0.1, 0.03, PAL.glass);
      part('sphere', 0.33, 0.42, 0.06, 0.14, 0.12, 0.14, PAL.green);
    },
    terrace() {
      const a = kitCtx.accent;
      for (let i = 0; i < 4; i++) {
        const w = 0.96 - i * 0.18, d = 0.72 - i * 0.14, y = 0.06 + i * 0.12, z = -0.06 - i * 0.06;
        part('box', 0, y, z, w, 0.12, d, PAL.green);
        part('box', 0, y + 0.07, z + d / 2, w, 0.035, 0.035, a);
        part('box', 0, y + 0.065, z + d / 2 - 0.025, w * 0.9, 0.018, 0.02, PAL.teal);
        for (let k = 0; k < 3; k++) {
          const cx = (k - 1) * w * 0.24;
          part('cylinder', cx, y + 0.13, z, 0.018, 0.1, 0.018, PAL.leaf2);
          part('ico', cx, y + 0.2, z, 0.07, 0.06, 0.07, PAL.leaf1);
        }
      }
      part('box', 0.34, 0.09, 0.36, 0.18, 0.06, 0.12, PAL.stone);
      part('box', 0.34, 0.16, 0.32, 0.18, 0.06, 0.12, PAL.stone);
    },
    ufo() {
      const a = kitCtx.accent;
      part('cylinder', 0, 0.04, 0, 0.82, 0.08, 0.82, PAL.stone);
      for (let i = 0; i < 3; i++) {
        const ang = i * Math.PI * 2 / 3 + 0.5;
        part('cylinder', Math.cos(ang) * 0.24, 0.215, Math.sin(ang) * 0.24, 0.035, 0.43, 0.035, PAL.ink);
      }
      part('cylinder', 0, 0.43, 0, 0.9, 0.1, 0.9, a);
      part('dome', 0, 0.47, 0, 0.5, 0.38, 0.5, PAL.glass);
      for (let i = 0; i < 8; i++) {
        const ang = i * Math.PI / 4;
        part('glowsphere', Math.cos(ang) * 0.42, 0.44, Math.sin(ang) * 0.42, 0.055, 0.055, 0.055, PAL.yellow);
      }
      for (let i = 0; i < 4; i++) part('box', 0, 0.33, 0, 0.36, 0.03, 0.06, PAL.cream, { ry: i * Math.PI / 4 });
    },
    museum() {
      const a = kitCtx.accent;
      part('box', 0, 0.04, 0, 0.98, 0.08, 0.74, PAL.stone);
      part('box', 0, 0.36, 0, 0.8, 0.56, 0.62, PAL.cream);
      for (const sx of [-0.3, -0.1, 0.1, 0.3]) part('cylinder', sx, 0.32, 0.34, 0.055, 0.44, 0.055, PAL.cream);
      part('prism', 0, 0.72, 0.06, 0.9, 0.3, 0.44, PAL.stone, { rx: Math.PI / 2 });
      part('dome', 0, 0.75, -0.08, 0.32, 0.28, 0.32, a);
      part('sphere', 0, 0.92, -0.08, 0.08, 0.08, 0.08, PAL.yellow);
      part('box', 0, 0.16, 0.32, 0.16, 0.24, 0.035, PAL.wood);
      part('glowbox', 0.26, 0.42, 0.335, 0.16, 0.16, 0.025, PAL.glass);
      part('box', 0.26, 0.31, 0.345, 0.2, 0.04, 0.02, a);
    }
  };

  for (const name of MODEL_NAMES) {
    if (typeof MODELS[name] !== 'function') throw new Error('模型原型缺少實作：' + name);
  }
  for (const name of Object.keys(MODELS)) {
    if (!MODEL_NAMES.has(name)) throw new Error('模型原型未列入 DATA.meta.modelPrototypes：' + name);
  }

  /* ---------- 6.5 主要樹木與街道家具 ---------- */
  function addKitTree(x, z, type, scale, rng, islandId) {
    kitBegin(x, z, TOP, scale, rng() * Math.PI * 2, null, islandId, rng);
    part('cylinder', 0, 0.15, 0, 0.11, 0.3, 0.11, PAL.wood, { detail: 1 });
    if (type === 'pine') {
      part('cone', 0, 0.46, 0, 0.5, 0.34, 0.5, PAL.leaf3, { detail: 1 });
      part('cone', 0, 0.62, 0, 0.42, 0.32, 0.42, PAL.leaf2, { detail: 1 });
      part('cone', 0, 0.78, 0, 0.32, 0.3, 0.32, PAL.leaf1, { detail: 1 });
    } else if (type === 'cherry') {
      part('sphere', 0, 0.52, 0, 0.56, 0.4, 0.56, PAL.pink, { detail: 1 });
      part('sphere', -0.18, 0.44, 0.05, 0.34, 0.28, 0.34, '#f7cad7', { detail: 1 });
      part('sphere', 0.2, 0.46, -0.08, 0.32, 0.26, 0.32, PAL.pink, { detail: 1 });
      part('ico', 0.02, 0.62, 0.06, 0.28, 0.22, 0.28, '#f7cad7', { detail: 1 });
    } else if (type === 'willow') {
      part('dome', 0, 0.48, 0, 0.66, 0.5, 0.66, PAL.leaf1, { detail: 1 });
      for (let i = 0; i < 5; i++) {
        const ang = i * Math.PI * 2 / 5;
        part('box', Math.cos(ang) * 0.24, 0.36, Math.sin(ang) * 0.24, 0.05, 0.36, 0.05, PAL.leaf2, { detail: 1, rz: Math.cos(ang) * 0.25 });
      }
      part('sphere', 0.1, 0.62, 0, 0.28, 0.22, 0.28, PAL.leaf3, { detail: 1 });
    } else if (type === 'fruit') {
      part('sphere', 0, 0.5, 0, 0.54, 0.4, 0.54, PAL.leaf1, { detail: 1 });
      part('sphere', -0.18, 0.52, 0.04, 0.34, 0.28, 0.34, PAL.leaf2, { detail: 1 });
      part('sphere', 0.16, 0.5, -0.08, 0.32, 0.26, 0.32, PAL.leaf3, { detail: 1 });
      for (const f of [[-0.1, 0.46, 0.24], [0.2, 0.52, 0.2], [0.02, 0.58, -0.2]]) {
        part('sphere', f[0], f[1], f[2], 0.06, 0.06, 0.06, f[1] > 0.5 ? PAL.yellow : PAL.coral, { detail: 1 });
      }
    } else {
      part('cylinder', 0.04, 0.36, 0, 0.09, 0.56, 0.09, PAL.wood, { detail: 1, rz: -0.12 });
      for (let i = 0; i < 5; i++) {
        const ang = i * Math.PI * 2 / 5;
        part('box', 0.04 + Math.cos(ang) * 0.22, 0.66, Math.sin(ang) * 0.22, 0.36, 0.035, 0.12, i % 2 ? PAL.leaf1 : PAL.leaf2, { detail: 1, ry: -ang, rz: 0.2 });
      }
      part('sphere', 0.04, 0.64, 0, 0.1, 0.1, 0.1, PAL.yellow, { detail: 1 });
    }
    kitCtx = null;
  }

  function addLamp(x, z, yaw, islandId, rng) {
    kitBegin(x, z, TOP, 1, yaw, null, islandId, rng);
    part('cylinder', 0, 0.24, 0, 0.05, 0.48, 0.05, PAL.ink, { detail: 2 });
    part('glowsphere', 0, 0.52, 0, 0.13, 0.13, 0.13, PAL.yellow, { detail: 2 });
    part('hip', 0, 0.61, 0, 0.16, 0.1, 0.16, PAL.ink, { detail: 2 });
    kitCtx = null;
  }
  function addPot(x, z, islandId, rng) {
    kitBegin(x, z, TOP, 1, rng() * Math.PI * 2, null, islandId, rng);
    part('cylinder', 0, 0.08, 0, 0.18, 0.16, 0.18, PAL.coral, { detail: 2 });
    part('ico', 0, 0.23, 0, 0.26, 0.22, 0.26, PAL.leaf2, { detail: 2 });
    part('ico', 0.07, 0.31, 0.03, 0.12, 0.1, 0.12, PAL.leaf1, { detail: 2 });
    kitCtx = null;
  }
  function addBench(x, z, yaw, islandId, rng) {
    kitBegin(x, z, TOP, 1, yaw, null, islandId, rng);
    part('box', 0, 0.2, 0, 0.44, 0.05, 0.17, PAL.wood, { detail: 2 });
    part('box', 0, 0.31, -0.08, 0.44, 0.18, 0.04, PAL.wood, { detail: 2 });
    for (const sx of [-1, 1]) {
      part('box', sx * 0.16, 0.1, 0, 0.04, 0.2, 0.14, PAL.ink, { detail: 2 });
      part('box', sx * 0.16, 0.27, -0.08, 0.04, 0.18, 0.035, PAL.ink, { detail: 2 });
    }
    kitCtx = null;
  }
  function addRimLight(x, z, islandId, rng) {
    kitBegin(x, z, TOP, 1, 0, null, islandId, rng);
    part('glowsphere', 0, 0.05, 0, 0.05, 0.05, 0.05, PAL.yellow, { detail: 2 });
    kitCtx = null;
  }

  /* ---------- 島內配置：主要模型、交錯格子、樹木與家具 ---------- */
  const ITEM_BY_ID = new Map(DATA.items.map((it) => [it.id, it]));
  const ITEM_SLOTS = [
    { x: -0.95, z: -0.12 }, { x: 0.95, z: -0.12 },
    { x: -0.84, z: 0.5 }, { x: 0.84, z: 0.5 }, { x: 0, z: 0.72 }
  ];
  const placedFree = (list, x, z, r) => !list.some((p) => Math.hypot(p.x - x, p.z - z) < p.r + r + 0.015);

  function placeItem(itemId, ox, oz, lx, lz, scale, yaw, isl) {
    const it = ITEM_BY_ID.get(itemId);
    if (!it) throw new Error('找不到項目模型資料：' + itemId);
    const model = MODELS[it.model];
    if (!model) throw new Error('模型原型未實作：' + it.model);
    const rng = rngFor('model:' + it.id);
    state.itemPos.set(itemId, new THREE.Vector3(ox + lx, TOP, oz + lz));
    kitBegin(ox + lx, oz + lz, TOP, scale, yaw, it.id, isl.id, rng, isl.color);
    model();
    kitCtx = null;
  }

  const lampPositions = [];
  for (const isl of DATA.islands) {
    const { x: ox, z: oz } = axialToWorld(isl.q, isl.r);
    const rng = rngFor('island:' + isl.id);
    const placed = [];
    const heroId = isl.heroItemId || isl.itemIds[0] || null;
    const others = isl.itemIds.filter((id) => id !== heroId);
    const scale = others.length >= 4 ? 0.47 : others.length >= 2 ? 0.55 : 0.62;
    if (heroId && isl.icon !== 'todo') {
      placeItem(heroId, ox, oz, 0, -0.58, MODEL_CFG.heroScale, 0, isl);
      placed.push({ x: 0, z: -0.58, r: 0.58 });
    } else {
      placed.push({ x: 0, z: -0.2, r: 0.44 });
      kitBegin(ox, oz - 0.2, TOP, 0.82, 0, null, isl.id, rng, isl.color);
      MODELS.garden();
      kitCtx = null;
    }
    if (others.length > ITEM_SLOTS.length) throw new Error('島嶼項目超過配置格位：' + isl.id);
    let placedOthers = 0;
    others.forEach((id, i) => {
      const slot = ITEM_SLOTS[i];
      if (!slot) return;
      if (!placedFree(placed, slot.x, slot.z, 0.3)) return;
      const yaw = (rng() - 0.5) * 0.34;
      placeItem(id, ox, oz, slot.x, slot.z, scale, yaw, isl);
      placed.push({ x: slot.x, z: slot.z, r: 0.3 });
      placedOthers++;
    });
    if (placedOthers !== others.length) throw new Error('島內配置空間不足：' + isl.id);

    const treeCount = 4 + (rng() < 0.66 ? 1 : 0) + (rng() < 0.32 ? 1 : 0);
    let made = 0;
    for (let attempt = 0; attempt < 96 && made < treeCount; attempt++) {
      const ang = attempt * 2.399963 + rng() * 0.16;
      const rad = attempt < 52 ? 1.3 : 1.2; // 樹幹在步道內緣(1.438)之內，樹冠微垂步道屬自然
      const tx = Math.cos(ang) * rad, tz = Math.sin(ang) * rad;
      if (!placedFree(placed, tx, tz, 0.23)) continue;
      addKitTree(ox + tx, oz + tz, isl.treeType, 0.78 + rng() * 0.22, rng, isl.id);
      placed.push({ x: tx, z: tz, r: 0.23 });
      made++;
    }
    if (made < 4) throw new Error('主要樹木不足（需 4–6 棵）：' + isl.id);

    for (let k = 0; k < 6; k++) {
      const ang = Math.PI / 6 + k * Math.PI / 3;
      const lxp = ox + Math.cos(ang) * 1.9, lzp = oz + Math.sin(ang) * 1.9;
      addLamp(lxp, lzp, -ang, isl.id, rng);
      lampPositions.push([lxp, lzp]);
    }
    let pots = 0;
    for (let attempt = 0; attempt < 84 && pots < 3; attempt++) {
      const ang = attempt * 2.399963 + 0.6;
      const pr = [1.15, 1.08, 1.2][attempt % 3];
      const px = Math.cos(ang) * pr, pz = Math.sin(ang) * pr;
      if (!placedFree(placed, px, pz, 0.16)) continue;
      addPot(ox + px, oz + pz, isl.id, rng);
      placed.push({ x: px, z: pz, r: 0.16 });
      pots++;
    }
    let benches = 0;
    for (let attempt = 0; attempt < 84 && benches < 2; attempt++) {
      const ang = attempt * 2.399963 + 1.1;
      const br = [1.02, 1.1, 0.94][attempt % 3];
      const bx = Math.cos(ang) * br, bz = Math.sin(ang) * br;
      if (!placedFree(placed, bx, bz, 0.22)) continue;
      addBench(ox + bx, oz + bz, -ang, isl.id, rng);
      placed.push({ x: bx, z: bz, r: 0.22 });
      benches++;
    }
    for (let k = 0; k < 12; k++) {
      const ang = k * Math.PI / 6;
      const rad = k % 2 === 1 ? 1.7 : 1.7 * Math.cos(Math.PI / 6);
      addRimLight(ox + Math.cos(ang) * rad, oz + Math.sin(ang) * rad, isl.id, rng);
    }
  }

  /* ---------- 建立 InstancedMesh 與模型歸屬索引 ---------- */
  const kitMeshList = [];
  const byItem = new Map(), byMesh = new Map();
  {
    const groups = new Map();
    for (const p of kitParts) {
      const key = p.kind + '|' + p.materialClass + '|' + p.detailLevel;
      let g = groups.get(key);
      if (!g) { g = { kind: p.kind, mat: p.materialClass, detail: p.detailLevel, parts: [] }; groups.set(key, g); }
      g.parts.push(p);
    }
    for (const g of groups.values()) {
      const mesh = new THREE.InstancedMesh(KG[g.kind], g.mat === 'glow' ? MAT_GLOW : MAT_SOLID, g.parts.length);
      const itemIds = new Array(g.parts.length).fill(null);
      const islandIds = new Array(g.parts.length).fill(null);
      const baseColors = new Array(g.parts.length);
      g.parts.forEach((p, i) => {
        mesh.setMatrixAt(i, p.matrix);
        mesh.setColorAt(i, p.color);
        itemIds[i] = p.itemId; islandIds[i] = p.islandId;
        baseColors[i] = p.color.clone();
        if (p.itemId) {
          if (!byItem.has(p.itemId)) byItem.set(p.itemId, []);
          byItem.get(p.itemId).push({ mesh, instanceId: i, baseColor: p.color.clone() });
        }
      });
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.castShadow = g.detail === 0;
      mesh.receiveShadow = g.detail === 0;
      mesh.userData.kind = g.kind;
      mesh.userData.materialClass = g.mat;
      mesh.userData.detailLevel = g.detail;
      mesh.userData.itemIds = itemIds;
      mesh.userData.islandIds = islandIds;
      mesh.userData.baseColors = baseColors;
      byMesh.set(mesh, { itemIds, islandIds });
      world.add(mesh);
      kitMeshList.push(mesh);
    }
  }
  if (byItem.size !== DATA.items.length) {
    throw new Error('模型歸屬索引不完整：' + byItem.size + '／' + DATA.items.length + ' 個項目');
  }
  state.modelMeshes = kitMeshList;
  state.modelIndex = { byItem, byMesh, items: ITEM_BY_ID };
  window.__modelIndex = state.modelIndex;
  $('#modelstats').textContent = '全台親子島・' + DATA.items.length + ' 景點・' + Object.keys(MODELS).length +
    ' 種模型原型・靜態零件庫 ' + kitMeshList.length + ' 個 InstancedMesh';
  console.info('[island-3d stage4]', {
    prototypes: Object.keys(MODELS).length, parts: kitParts.length,
    kitInstancedMeshes: kitMeshList.length, items: ITEM_BY_ID.size,
    byItem: byItem.size, mode: DATA.meta.mode
  });

  const LAMP_POOL_MAT = new THREE.MeshBasicMaterial({
    color: '#ffc777', transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide, fog: false
  });
  const lampPoolGeo = new THREE.CircleGeometry(0.32, 12).rotateX(-Math.PI / 2);
  const lampPoolMesh = new THREE.InstancedMesh(lampPoolGeo, LAMP_POOL_MAT, lampPositions.length);
  {
    const o = new THREE.Object3D();
    lampPositions.forEach((p, i) => {
      o.position.set(p[0], TOP + 0.03, p[1]);
      o.rotation.set(0, 0, 0); o.scale.setScalar(1);
      o.updateMatrix(); lampPoolMesh.setMatrixAt(i, o.matrix);
    });
    lampPoolMesh.instanceMatrix.needsUpdate = true;
    lampPoolMesh.renderOrder = 3;
    world.add(lampPoolMesh);
  }

  /* ---------- 5.9 遠景：盆地地形、背景樹 ---------- */
  loadmsg('佈置盆地地形與背景樹…');
  const terrainNoise = new SimplexNoise({ random: mulberry32(hashSeed('terrain-noise')) });
  const smoothstep = (a, b, x) => {
    const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const fbm2 = (x, z) => {
    let amp = 0.5, freq = 1, sum = 0, norm = 0;
    for (let i = 0; i < 4; i++) {
      sum += terrainNoise.noise(x * freq, z * freq) * amp;
      norm += amp; amp *= 0.5; freq *= 2.02;
    }
    return sum / norm;
  };
  function terrainHeight(x, z) {
    const r = Math.hypot(x, z);
    let h = -2.6 + fbm2(x * 0.04, z * 0.04) * 0.7;
    const ridge = smoothstep(31, 58, r);
    h += ridge * (4.2 + fbm2(x * 0.028 + 11, z * 0.028 - 7) * 5.5 + Math.abs(fbm2(x * 0.09, z * 0.09)) * 2);
    h = THREE.MathUtils.lerp(h, Math.round(h * 2) / 2, 0.34 * smoothstep(33, 48, r));
    const front = (x * 0.24 + z * 0.87) / Math.max(r, 0.001);
    h *= 1 - 0.34 * smoothstep(30, 52, r) * smoothstep(0.12, 0.82, front);
    h = THREE.MathUtils.lerp(h, -2.4, smoothstep(66, 84, r));
    return h;
  }
  {
    const geo = new THREE.PlaneGeometry(170, 170, 160, 160).rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const cRiver = new THREE.Color('#8fb3ad'), cSand = new THREE.Color('#d9c9a3');
    const cField = new THREE.Color('#aec493'), cGrass = new THREE.Color('#a3b986');
    const cForest = new THREE.Color('#6f8a62'), cRock = new THREE.Color('#b2a38d');
    const col = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      const h = terrainHeight(x, z);
      pos.setY(i, h);
      if (h < 0.15) col.copy(cRiver);
      else if (h < 0.7) col.copy(cSand);
      else if (h < 1.6) col.copy(cField);
      else if (h < 3.0) col.copy(cGrass);
      else if (h < 5.2) col.copy(cForest);
      else col.copy(cRock);
      col.multiplyScalar(0.94 + 0.12 * (fbm2(x * 0.11 + 5, z * 0.11 - 3) + 0.5));
      colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      vertexColors: true, flatShading: true, roughness: 0.97, metalness: 0
    }));
    terrain.position.set(worldCenter.x, 0, worldCenter.z);
    terrain.receiveShadow = false;
    world.add(terrain);
  }

  /* 背景樹：針葉 3 cone、闊葉 4 ico，固定種子微擾，不投影 */
  {
    const treeRng = rngFor('background-trees');
    const nonIndexed = (g) => (g.index ? g.toNonIndexed() : g);
    const coniferGeo = (() => {
      const gs = [];
      const trunk = new THREE.CylinderGeometry(0.06, 0.09, 0.5, 5); trunk.translate(0, 0.25, 0); gs.push(nonIndexed(trunk));
      const c1 = new THREE.ConeGeometry(0.48, 0.9, 6); c1.translate(0, 0.78, 0); gs.push(nonIndexed(c1));
      const c2 = new THREE.ConeGeometry(0.38, 0.78, 6); c2.translate(0, 1.1, 0); gs.push(nonIndexed(c2));
      const c3 = new THREE.ConeGeometry(0.27, 0.64, 6); c3.translate(0, 1.4, 0); gs.push(nonIndexed(c3));
      return BufferGeometryUtils.mergeGeometries(gs, false);
    })();
    const broadGeo = (() => {
      const gs = [];
      const trunk = new THREE.CylinderGeometry(0.07, 0.1, 0.55, 5); trunk.translate(0, 0.27, 0); gs.push(nonIndexed(trunk));
      for (let i = 0; i < 4; i++) {
        const blob = new THREE.IcosahedronGeometry(0.38 + treeRng() * 0.12, 0);
        blob.translate((treeRng() - 0.5) * 0.5, 0.72 + treeRng() * 0.3, (treeRng() - 0.5) * 0.5);
        gs.push(nonIndexed(blob));
      }
      return BufferGeometryUtils.mergeGeometries(gs, false);
    })();
    const coniferPos = [], broadPos = [];
    const target = isMobile ? MODEL_CFG.backgroundTreesMobile : MODEL_CFG.backgroundTreesDesktop;
    for (let attempt = 0; attempt < target * 6 && coniferPos.length + broadPos.length < target; attempt++) {
      const ang = treeRng() * Math.PI * 2;
      const rad = 30 + Math.pow(treeRng(), 0.82) * 30;
      const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
      const h = terrainHeight(x, z);
      if (h < 0.3) continue;
      const slope = Math.hypot(terrainHeight(x + 0.45, z) - h, terrainHeight(x, z + 0.45) - h) / 0.45;
      if (slope > 1.15) continue;
      const rec = { x: worldCenter.x + x, y: h, z: worldCenter.z + z,

  function envAt(minutes) {
    const m = ((minutes % 1440) + 1440) % 1440;
    let i = 0;
    while (i < KF.length - 2 && KF[i + 1].m <= m) i++;
    const a = KF[i], b = KF[i + 1];
    const t = THREE.MathUtils.clamp((m - a.m) / (b.m - a.m), 0, 1);
    const mix = (out, ca, cb) => out.copy(_ca.set(ca)).lerp(_cb.set(cb), t);
    mix(ENV.top, a.top, b.top); mix(ENV.hor, a.hor, b.hor); mix(ENV.sun, a.sun, b.sun);
    ENV.sunI = a.sunI + (b.sunI - a.sunI) * t;
    mix(ENV.hs, a.hs, b.hs); mix(ENV.hg, a.hg, b.hg);
    ENV.hemiI = a.hemiI + (b.hemiI - a.hemiI) * t;

    fly = { t: 0, dur: reducedMotion ? 0 : 0.8, fromT: controls.target.clone(), toT: target, fromP: camera.position.clone(), toP: pos };
    if (reducedMotion) { controls.target.copy(target); camera.position.copy(pos); fly = null; }
    dirty = true;
  }
  function selectIsland(id, flyTo, keepItem) {

    state.selectedWalkerId = null;

    for (const [key, rec] of state.islandMeshes) {

    renderSidebar();
    updateRelVisibility();
    setLogFilter('');
    const box = $('#info');
    if (!id) { state.selectedItemId = null; highlightItem(null); box.classList.remove('show'); dirty = true; return; }
    const isl = DATA.islands.find((i) => i.id === id);

  /* ---------- 階段 3：統一選取入口 selectItem / selectFlow ---------- */
  function selectItem(itemId, flyTo) {

    }

    dirty = true;
  }
  function selectFlow(flowId, flyTo) {
    const f = DATA.flows.find((x) => x.id === flowId);

    selectIsland(null, false);
    state.selectedItemId = null;
    state.selectedWalkerId = null;
    state.selectedFlowId = flowId;

      const A = DATA.islands.find((i) => i.id === (f.fromIslandId || f.from)), B = DATA.islands.find((i) => i.id === (f.toIslandId || f.to));

  function selectWalker(walkerId, flyTo) {

        sampleFlow(rec, w.d, _wPos, _wTan);

        flyCam(target, new THREE.Vector3(1.4, 2.0, 2.6));

    setLogFilter(w.flowId);
    log('查看角色：' + w.name + '（' + w.actorLabel + '）');
    dirty = true;
  }

  /* ---------- 階段 4：活動日誌（真事件、關係篩選、上限 50） ---------- */
  const LOG_MAX = 50;
  const logEntries = [];
  let logFilterValue = '';
  const logEsc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function fmtSimTime(t) {
    const sec = Math.max(0, Math.floor(t));
    const mm = String(Math.floor(sec / 60)).padStart(2, '0');
    const ss = String(sec % 60).padStart(2, '0');
    return 'T+' + mm + ':' + ss;
  }
  function renderLog() {
    const ol = $('#loglist');
    if (!ol) return;
    const list = logEntries.filter((e) => {
      if (logFilterValue === 'all') return true;
      if (logFilterValue === '') return e.sim;
      return e.flowId === logFilterValue;
    });
    if (!list.length) {
      ol.innerHTML = '<li class="lg-empty">' + ((logFilterValue && logFilterValue !== 'all') ? '這條關係尚無模擬事件' : (logFilterValue === 'all' ? '尚無活動紀錄' : '尚無模擬事件')) + '</li>';
      return;
    }
    ol.innerHTML = list.map((e) => '<li>' + fmtSimTime(e.t) + ' ' + logEsc(e.msg) + '</li>').join('');
  }
  function setLogFilter(id) {
    logFilterValue = id || '';
    const sel = $('#logflow');
    if (sel) sel.value = logFilterValue;
    renderLog();
  }
  function log(msg, flowId, sim) {
    logEntries.unshift({ t: state.simTime || 0, msg, flowId: flowId || null, sim: sim === true });
    while (logEntries.length > LOG_MAX) logEntries.pop();
    renderLog();
  }
  {
    const sel = $('#logflow');
    if (sel) {
      for (const f of DATA.flows) {
        const opt = document.createElement('option');
        opt.value = f.id; opt.textContent = f.name;
        sel.appendChild(opt);
      }
      sel.addEventListener('change', () => { logFilterValue = sel.value; renderLog(); });
    }
  }

  /* ---------- 階段 3：新手說明 ---------- */
  const INTRO = ['<b>第 1 步・拖曳旋轉</b><br>拖曳旋轉群島，滾輪縮放，點島嶼與模型看內容。', '<b>第 2 步・搜尋與卡片</b><br>右側搜尋景點、看卡片、點導航出發。', '<b>第 3 步・角色與關係</b><br>點小人看角色卡；開關係線與圖例，日誌可依關係篩選。'];

  $('#h-home').addEventListener('click', () => { framePanorama(); log('回到全景'); dirty = true; });
  $('#h-list').addEventListener('click', (e) => { const sb = $('#sidebar'); sb.hidden = !sb.hidden; e.currentTarget.classList.toggle('on', !sb.hidden); });
  $('#h-help').addEventListener('click', () => { showIntro(0); });
  let tourTimer = null, tourIdx = 0;
  $('#h-tour').addEventListener('click', (e) => {
    const b = e.currentTarget;
    const stages = DATA.story.stages || [];
    if (tourTimer) {
      clearInterval(tourTimer); tourTimer = null;
      state.storyStage = null; highlightItem(state.selectedItemId);
      b.classList.remove('on'); b.querySelector('span:last-child').textContent = '導覽'; log('停止導覽'); dirty = true; return;
    }
    if (!stages.length) return;

      b.querySelector('span:last-child').textContent = (n + 1) + '/' + stages.length + ' ' + st.label;

      if (islId) selectIsland(islId, true);
      highlightItem(state.selectedItemId);

  /* ---------- 階段 3：搜尋側欄、卡片、縮圖 ---------- */
  const POWER_TXT = ['', '輕量放電', '中度放電', '重度放電']; // 保留：後續階段與正規化共用級別名
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const islandItems = (islId) => DATA.items.filter((it) => it.islandId === islId);
  const matchQ = (q, ...fields) => { q = (q || '').trim(); if (!q) return true; return fields.join(' ').indexOf(q) !== -1; };
  let sbTab = 'cat';

  function renderSidebar() {
    if (sbTab === 'flow') { renderFlows(); return; }
    const q = $('#sbq').value || '';
    const cat = $('#sb-cat');
    let html = '';
    for (const isl of DATA.islands) {
      const items = islandItems(isl.id);
      const showIsl = matchQ(q, isl.name, isl.en, isl.summary);
      const hitItems = items.filter((it) => matchQ(q, it.name, it.summary, (it.facts || []).join(' '), (it.tags || []).join(' '), it.tip || '', it.addr || ''));
      if (q.trim() && !showIsl && !hitItems.length) continue;
      const list = (q.trim() && !showIsl) ? hitItems : items;
      const open = (q.trim() || isl.id === state.selectedIsland) ? ' open' : '';
      html += '<details' + open + '><summary>' + esc(isl.name) + '・' + (items.length ? items.length + '景點' : '待補') + '</summary><ul>';
      if (!list.length) html += '<li>還沒有景點資料</li>';
      for (const it of list) html += '<li><a data-item="' + it.id + '">' + esc(it.name) + '</a></li>';
      html += '</ul></details>';
    }
    cat.innerHTML = html || '<div class="sb-empty">找不到結果，換個關鍵字試試（例如：沙坑、溜索、廁所）</div>';

  }

  function renderFlows() {
    const q = $('#sbq').value || '';
    const box = $('#sb-flow');
    let html = '';
    for (const f of DATA.flows) {
      const A = DATA.islands.find((i) => i.id === f.fromIslandId), B = DATA.islands.find((i) => i.id === f.toIslandId);
      if (!matchQ(q, f.name, f.description, A.name, B.name)) continue;
      html += '<button class="flowrow" data-flow="' + f.id + '">〜 ' + esc(f.name) + ' <small>(' + esc(A.name) + '↔' + esc(B.name)       + (f.evidence === 'pending' ? '・待確認' : (f.evidence === 'documented' ? '・有來源' : '・主題關聯')) + ')</small></button>';
    }
    box.innerHTML = html || '<div class="sb-empty">找不到關係，換個關鍵字試試</div>';

  function chipRow(items) {

  function wireChips(box) {

  const THUMB_HOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" rx="12" fill="#f3e9d8"/><text x="80" y="92" font-size="46" text-anchor="middle" fill="#b48560">島</text></svg>');
  let thumbRT = null;
  const thumbCache = new Map();
  const thumbCanvas = document.createElement('canvas'); thumbCanvas.width = thumbCanvas.height = 160;
  function makeThumb(it) {
    if (thumbCache.has(it.id)) return thumbCache.get(it.id);
    thumbCache.set(it.id, THUMB_HOLDER);
    try {
      if (!thumbRT) thumbRT = new THREE.WebGLRenderTarget(160, 160);
      const keep = kitParts.length;
      const rng = rngFor('thumb:' + it.id);
      kitBegin(0, 0, 0, 1, 0, it.id, it.islandId, rng, '#E85A24');
      MODELS[it.model]();
      kitCtx = null;
      const parts = kitParts.splice(keep);
      const sc = new THREE.Scene();
      sc.add(new THREE.HemisphereLight(0xffffff, 0x8f8270, 1.6));
      const key = new THREE.DirectionalLight(0xfff1de, 2.2);
      key.position.set(3, 5, 4); sc.add(key);
      const grp = new THREE.Group();
      const ps = new THREE.Vector3();
      const tempMats = [];
      for (const pt of parts) {
        const glow = pt.materialClass === 'glow';
        const mt = glow
          ? new THREE.MeshStandardMaterial({ color: pt.color, emissive: new THREE.Color('#ffc777'), emissiveIntensity: 0.7 })
          : new THREE.MeshStandardMaterial({ color: pt.color, roughness: 0.8 });
        tempMats.push(mt);
        const m = new THREE.Mesh(KG[pt.kind], mt);
        m.position.setFromMatrixPosition(pt.matrix);
        m.quaternion.setFromRotationMatrix(pt.matrix);
        m.scale.copy(ps.setFromMatrixScale(pt.matrix));
        grp.add(m);
      }
      sc.add(grp);
      const bound = new THREE.Box3().setFromObject(grp);
      const c = bound.getCenter(new THREE.Vector3());
      const sz = Math.max(bound.getSize(new THREE.Vector3()).length(), 0.6);
      const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
      cam.position.set(c.x + sz * 0.9, c.y + sz * 0.7, c.z + sz * 0.9);
      cam.lookAt(c);
      renderer.setRenderTarget(thumbRT);
      renderer.render(sc, cam);
      const px = new Uint8Array(160 * 160 * 4);
      renderer.readRenderTargetPixels(thumbRT, 0, 0, 160, 160, px);
      renderer.setRenderTarget(null);
      const ctx2 = thumbCanvas.getContext('2d');
      const img2 = ctx2.createImageData(160, 160);
      for (let y = 0; y < 160; y++) img2.data.set(px.subarray((159 - y) * 160 * 4, (160 - y) * 160 * 4), y * 160 * 4);
      ctx2.putImageData(img2, 0, 0);
      const out = thumbCanvas.toDataURL('image/png');
      thumbCache.set(it.id, out);
      for (const mt of tempMats) mt.dispose();
      const img = document.querySelector('img.thumb[data-thumb="' + it.id + '"]');
      if (img && img.src !== out) img.src = out;
      dirty = true;
    } catch (e) { /* 縮圖失敗保留佔位，不阻止展示 */ }
    return thumbCache.get(it.id);
  }

  $('#sidebar').hidden = matchMedia('(max-width: 800px)').matches; // 與 CSS 同一把尺，手機預設收起
  $('#tab-cat').textContent = DATA.labels.tabs.cat;
  $('#tab-flow').textContent = DATA.labels.tabs.flow;
  $('#sbq').placeholder = DATA.labels.searchPlaceholder;
  $('#brand h1').textContent = DATA.meta.title;
  $('#brand p').textContent = DATA.meta.subtitle + '｜' + DATA.meta.audience;
  renderSidebar();
  log('全台親子島載入完成，22 島就緒', null, false);
  log('角色模擬啟動：' + walkers.length + ' 名角色走陸上順遊與島嶼步道（SIMULATION）', null, false);
  $('#intro-next').addEventListener('click', () => showIntro(introIdx + 1));
  $('#intro-skip').addEventListener('click', () => showIntro(INTRO.length));
  try { if (!localStorage.getItem('island3d-intro')) setTimeout(() => showIntro(0), 900); } catch (e) {}

  /* ---------- 尺寸變化 ---------- */
  new ResizeObserver(() => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    labelRenderer.setSize(innerWidth, innerHeight);
    if (!state.userInteracted && !state.selectedIsland) framePanorama();
    dirty = true;
  }).observe(document.body);

  /* ---------- 主迴圈（統一 simulationTime，dt 上限 0.08） ---------- */
  let simTime = 0, last = performance.now(), lastShown = -1;
  controls.addEventListener('change', () => { dirty = true; });
  setInterval(persist, 5000);

  function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function tick(now) {
    if (state.dead) return;
    requestAnimationFrame(tick);
    const dt = Math.min((now - last) / 1000, 0.08); last = now;
    let adv = true;
    if (document.hidden || reducedMotion || state.paused) adv = false;
    if (adv) {
      simTime += dt;
      state.simTime = simTime;
      state.envMinutes = (state.envMinutes + dt * DATA.environment.minutesPerSecond) % 1440;
      applyEnv(); // 視覺每幀線性插值，日夜連續
      const shown = Math.floor(state.envMinutes / 10);
      if (shown !== lastShown) { lastShown = shown; updateClock(); }
      waterUni.uTime.value = simTime;
      updateClouds(simTime * 0.35);
      updateBoats(simTime);
      updateFlowTime(simTime);
      updateWalkers(dt, true);
      updateFerryDots(dt);
      dirty = true;
    }
    if (fly) {
      fly.t += dt;
      const k = easeInOutCubic(Math.min(fly.t / fly.dur, 1));
      controls.target.lerpVectors(fly.fromT, fly.toT, k);
      camera.position.lerpVectors(fly.fromP, fly.toP, k);
      if (fly.t >= fly.dur) fly = null;
      dirty = true;
    }
    const moved = controls.update();
    if (!adv && (moved || dirty)) { updateWalkers(0, false); updateFerryDots(0); }
    if (updateModelLOD()) dirty = true;
    if (dirty || moved) {
      try {
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
      } catch (e) {
        state.dead = true;
        fail('算圖失敗', '原因：' + (e && e.message ? e.message : String(e)) + '\n可按下方按鈕重新載入。');
        return;
      }
      if (shaderError) {
        state.dead = true;
        fail('著色器編譯失敗', shaderError + '\n請回報此訊息，或按下方按鈕重新載入。');
        return;
      }
      dirty = false;
    }
  }

  loadmsg('算圖第一幀…');
  updateModelLOD();
  updateWalkers(0, false);
  try {
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  } catch (e) {
    throw new Error('第一幀渲染失敗：' + (e && e.message ? e.message : String(e)));
  }
  if (shaderError) {
    fail('著色器編譯失敗', shaderError + '\n請回報此訊息，或按下方按鈕重新載入。');
    return;
  }
  window.__booted = true;
  $('#loading').style.display = 'none';
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
